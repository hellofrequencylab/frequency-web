# Copy the On Air ambient tracks from public/tracks into Supabase Storage and verify each stored
# copy byte for byte (SCAN-1213, scripts/upload-on-air-tracks.mjs). Manual only. Needs repo
# secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
name: on-air-tracks-upload

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: on-air-tracks-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No install: the script uses Node's own fetch, fs and crypto.
      - name: Upload and verify the tracks
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-on-air-tracks.mjs
