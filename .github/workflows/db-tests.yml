# RLS / RPC database tests (ADR-275). Boots a fresh local Supabase, applies EVERY migration in
# supabase/migrations in order (so an un-applicable migration — e.g. the `<->`/search_path bug
# fixed in ADR-277 — fails right here), then runs the pgTAP suite in supabase/tests via
# `supabase test db`. This is the DB-backed half of the authz harness that vitest can't cover.
#
# Runs on every PR since 2026-08-03 (ADR-923): the migration ledger is reconciled, the last
# latent fresh-apply bug (stray authoring tags in 20261161000000) is fixed, and the full apply +
# suite is green — so migration drift and policy regressions now fail the PR that introduces
# them. Owner follow-up: mark this a required check in branch protection.
name: db-tests

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/db-tests.yml'

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # The CLI comes from the repo's own `supabase` devDependency, NOT `supabase/setup-cli`.
      # ⚠️ Measured 2026-08-12 (ADR-1018): setup-cli@v3 downloads Bun from GitHub *releases*
      # before it does anything else, and that download returned `socket hang up` then HTTP 503
      # on two consecutive runs of PR #2110 — a required-ish check failing on an outage in a
      # third party's CDN, with no retry we control. The npm route resolves
      # `@supabase/cli-linux-x64`, an optional dependency already pinned in pnpm-lock.yaml and
      # already downloaded by every other CI job, so this adds no new network dependency at all.
      # It also kills `version: latest` — an unpinned input into a gate — and makes CI run the
      # exact CLI a developer runs via `pnpm test:rls`.
      - name: Install
        run: pnpm install --frozen-lockfile
      # Boots the full local stack (Postgres + auth + extensions like PostGIS) and applies every
      # supabase/migrations file in order. A migration that can't apply fails the job here.
      - name: Start local Supabase (applies all migrations)
        run: pnpm exec supabase db start
      # Runs every supabase/tests/*.test.sql through pgTAP against the freshly-migrated DB.
      - name: Run pgTAP RLS/RPC tests
        run: pnpm exec supabase test db
