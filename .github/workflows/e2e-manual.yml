          name: visual-baselines
          path: |
            test/e2e/__screenshots__/
            test/e2e/.degraded-capture.jsonl
          retention-days: 7
          # The refusal marker is a dotfile, and it is the one file worth having when a capture
          # was refused: the URLs and statuses the browser actually saw (LIVE-333).
