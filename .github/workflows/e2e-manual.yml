# E2E against a live URL, the MAINTAINER path. Dispatch-only, so nothing here ever appears
# on a pull request.
#
# It lives apart from e2e.yml on purpose. These jobs used to sit in the same file behind
# `if: github.event_name == 'workflow_dispatch'`, which meant every PR showed four checks
# reading "smoke — skipped", "visual — skipped", "update-baselines — skipped",
# "update-a11y — skipped". They were skipping because they are dispatch-only, but the
# checklist made it look like the preview gate had been disabled or the Vercel bypass
# secret was missing. A checklist that says "skipped" for a job that CANNOT run on a PR
# teaches people to ignore the word, and the one place it needs to mean something is
# e2e.yml, where "skipped" really does mean "nothing was tested".
#
# So: PRs see only the automatic e2e checks (pr-compare + lighthouse, ADR-936), never these.
# This file is what you reach for by hand.
#
#   base_url         where to point Playwright (a preview URL, or production)
#   run_visual       also run the @visual compare against committed baselines
#   update_baselines CAPTURE fresh @visual baselines and commit them to the branch
#   update_a11y      CAPTURE the @a11y ratchet counts and commit them to the branch
#   capture_shell    ALSO cover the member shell (/feed, the room, /settings, the Space
#                    console) by minting a session first — see below
#
# ── capture_shell, and why it is opt-in ───────────────────────────────────────────────────
# The four member-shell surfaces have NEVER had baselines, because sign-in is magic-link only
# and the suite could not authenticate itself (ADR-948's 🔴 amendment). With the secrets in
# place this flag mints a session per run and brings them into the matrix. It defaults OFF so
# the first capture is something you chose, not something a routine baseline refresh did to
# you: `update_baselines + capture_shell` writes 12 brand-new PNGs (16 with PW_SPACE_SLUG),
# and `update_a11y + capture_shell` seeds the shell's a11y debt, which is what stops the first
# PR run reaching /feed from failing on debt that predates it.
#
# Secrets it needs: SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL, PW_MEMBER_EMAIL.
# Repo variables it reads: PW_ROOM_PATH (default /channels), PW_SPACE_SLUG (adds the console).
# Full procedure: test/e2e/README.md § The member shell.
#
# ⚠️ THE COMMIT THIS MAKES WILL NOT RE-RUN CI. Both capture jobs push with GITHUB_TOKEN, and
# GitHub deliberately suppresses workflow runs triggered by that token so an Action cannot
# recurse into itself. So after a capture lands you get a branch whose newest commit has NO
# `checks`, NO `pr-compare`, NO `analyze` — only Vercel, which uses its own webhook and is
# unaffected. Observed on PR #2026 (2026-08-05): commit 6ced257 re-captured all 64 baselines
# and produced exactly one check run.
#
# The failure mode is waiting: the PR looks mid-run forever because the run was never queued.
#
# And re-running the PREVIOUS failed run does NOT fix it — a re-run replays the same SHA, so
# it would judge the new baselines' commit against the old commit's tree. Push a commit to
# the branch instead (any real change), which fires `pull_request: synchronize` normally.
name: e2e (manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (e.g. a Vercel preview URL). Required.'
        required: true
        default: ''
        type: string
      run_visual:
        description: 'Also run the @visual snapshot suite (needs committed baselines)'
        required: false
        default: false
        type: boolean
      update_baselines:
        description: 'CAPTURE fresh @visual baselines against base_url and commit them to the branch'
        required: false
        default: false
        type: boolean
      update_a11y:
        description: 'CAPTURE the @a11y ratchet baselines against base_url and commit them (falls are written down; a RISE fails the job rather than being laundered into the baseline)'
        required: false
        default: false
        type: boolean
      capture_shell:
        description: 'Include the MEMBER SHELL (/feed, the room, /settings, the Space console). Mints a session first; needs the SUPABASE_SERVICE_ROLE_KEY + PW_MEMBER_EMAIL secrets. Leave OFF for a marketing-only run.'
        required: false
        default: false
        type: boolean

# contents: write is needed ONLY by the two capture jobs' commit steps.
permissions:
  contents: write

concurrency:
  # Never cancel a maintainer capture: a half-written baseline set is worse than a slow one.
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    # Manual path only — the PR path runs its own smoke step against the resolved preview.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # ── The member shell, on purpose (ADR-950) ─────────────────────────────────────────
      # `capture_shell` is OPT-IN because the four app-shell surfaces have never had
      # baselines: their first capture is a deliberate act, not something a routine dispatch
      # should spring on you. Unlike the PR gate, this step FAILS when the secrets are
      # absent — you asked for the shell, so quietly handing back the marketing site would be
      # the same silence in a different wrapper.
      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      # `pnpm test:e2e` is grep-invert @visual, i.e. @smoke AND @a11y — the two suites with
      # no committed-baseline dependency.
      - name: Smoke + a11y suite
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
        run: pnpm test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  update-baselines:
    if: ${{ inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Same opt-in mint as the smoke job. THIS is the job that takes the member shell's
      # first-ever baselines: 12 PNGs (3 surfaces × 2 modes × 2 viewports), or 16 with
      # PW_SPACE_SLUG set. Expect the commit below to be large the first time and to name
      # only `app-*` files; anything else in that diff is a regression, not a capture
      # (ADR-948's attribution property).
      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      - name: Capture baselines
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
        run: pnpm test:e2e:update
      - name: Commit baselines to the branch
        # The runner commits the captures directly: artifact downloads redirect to a
        # storage host the agent sandbox's network policy blocks, so an artifact-only
        # hand-off dead-ends. always(): a single flaky surface must not discard the
        # other captures — the job stays red on real failures, but partials still land.
        #
        # ⚠️ THIS COMMIT DOES NOT RE-TRIGGER CI. GitHub deliberately suppresses workflow
        # runs for pushes made with GITHUB_TOKEN, so the freshly captured baselines land on
        # the branch with ZERO checks against them and the PR's last judged SHA stays the
        # commit BEFORE the capture. That reads exactly like "CI passed on the new
        # baselines" when nothing evaluated them. Push any commit of your own afterwards
        # (or re-run the PR's checks) to get the branch judged on what it now contains.
        if: always()
        run: |
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add test/e2e/__screenshots__/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Visual baselines: capture against ${{ inputs.base_url }} (runner-committed)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload baselines (debug copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: test/e2e/__screenshots__/
          retention-days: 7

  # The a11y ratchet's seed/re-freeze path (ADR-928). Same shape as update-baselines and for
  # the same reason: the numbers must come from a real deployment, and only the runner holds
  # the bypass secret that gets past Deployment Protection.
  update-a11y:
    if: ${{ inputs.update_a11y }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # PW_A11Y_UPDATE makes every @a11y test RECORD its violation count instead of asserting
      # against the baseline, so the capture cannot fail on the debt it is there to measure.
      # With capture_shell on, this also SEEDS the shell's a11y debt. It matters: a surface
      # with no entry in a11y-baselines.json is held to `$defaultMax` (0 serious+), so the
      # first PR run that reaches /feed would fail on debt that predates it. Seed here first,
      # deliberately, with the numbers written down and named.
      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      - name: Capture a11y counts
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_A11Y_UPDATE: '1'
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
        run: pnpm test:e2e:a11y
      # Merge is asymmetric and exits non-zero on a rise, so a regression cannot be quietly
      # absorbed by re-running this job. No always() here for exactly that reason.
      - name: Merge into the ratchet
        run: pnpm a11y:baselines
      - name: Commit baselines to the branch
        # Same GITHUB_TOKEN caveat as update-baselines above: this push does NOT re-trigger
        # CI, so the branch carries new baselines that nothing has been judged against.
        run: |
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add test/e2e/a11y-baselines.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "a11y baselines: capture against ${{ inputs.base_url }} (runner-committed)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload capture + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-capture
          path: |
            test/e2e/a11y-baselines.json
            test/e2e/.a11y-observed.jsonl
            playwright-report/
          retention-days: 7
          include-hidden-files: true

  visual:
    if: ${{ inputs.run_visual }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      - name: Visual suite
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
        run: pnpm test:e2e:visual
      - name: Upload report + diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
