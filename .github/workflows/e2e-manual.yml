      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # PW_A11Y_UPDATE makes every @a11y test RECORD its violation count instead of asserting
      # against the baseline, so the capture cannot fail on the debt it is there to measure.
      # With capture_shell on, this also SEEDS the shell's a11y debt. It matters: a surface
      # with no entry in a11y-baselines.json is held to `$defaultMax` (0 serious+), so the
      # first PR run that reaches /feed would fail on debt that predates it. Seed here first,
      # deliberately, with the numbers written down and named.
      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      - name: Capture a11y counts
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_A11Y_UPDATE: '1'
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
          # THE SAME TWO OPT-IN RATCHETS THE PR GATE READS (e2e.yml), so the owner's ONE repo
          # variable covers BOTH paths. Until 2026-09-08 this file read neither, which made the
          # opt-in half a switch: setting PW_REQUIRE_OPERATOR=1 would have turned the PR gate red
          # and left the CAPTURE path — this workflow, the one you dispatch to take the operator
          # baselines — green over a capture that photographed none of them. Measured, not
          # theorised: run 34174895830 (2026-09-08, production) printed
          # `::error ... bounced off the /admin role floor` for all seven operator routes and the
          # `smoke` job still concluded SUCCESS (ADR-1266).
          #
          # Gated on `capture_shell` because a marketing-only dispatch asks for neither half, and a
          # ratchet that fires on a run that never wanted the shell is the red-X-that-means-nothing
          # this file's header refuses to ship. Read from EITHER tab for e2e.yml's stated reason.
          PW_REQUIRE_SHELL: ${{ inputs.capture_shell && (vars.PW_REQUIRE_SHELL || secrets.PW_REQUIRE_SHELL) || '' }}
          PW_REQUIRE_OPERATOR: ${{ inputs.capture_shell && (vars.PW_REQUIRE_OPERATOR || secrets.PW_REQUIRE_OPERATOR) || '' }}
        run: pnpm test:e2e:a11y
      # Merge is asymmetric and exits non-zero on a rise, so a regression cannot be quietly
      # absorbed by re-running this job. No always() here for exactly that reason.
      - name: Merge into the ratchet
        run: pnpm a11y:baselines
      - name: Commit baselines to the branch
        # 🔴 NO `always()` HERE, AND IT MUST STAY THAT WAY (LIVE-333, ADR-1351). GitHub prepends
        # an implicit `success()` to a step with no `if:`, so a capture that refused a surface —
        # a degraded deployment, an a11y regression, anything — stops this step and the numbers
        # are never merged or pushed. That is the step ORDER doing the work the update-baselines
        # job needs an explicit marker check for, because that job's commit step IS `always()`.
        # Adding `always()` here would silently reopen the same hole.
        #
        # Same GITHUB_TOKEN caveat as update-baselines above: this push does NOT re-trigger
        # CI, so the branch carries new baselines that nothing has been judged against.
        run: |
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add test/e2e/a11y-baselines.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "a11y baselines: capture against ${{ inputs.base_url }} (runner-committed)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload capture + report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-capture
          path: |
            test/e2e/a11y-baselines.json
            test/e2e/.a11y-observed.jsonl
            playwright-report/
          retention-days: 7
          include-hidden-files: true

