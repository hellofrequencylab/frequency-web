      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      - name: Visual suite
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
          # THE SAME TWO OPT-IN RATCHETS THE PR GATE READS (e2e.yml), so the owner's ONE repo
          # variable covers BOTH paths. Until 2026-09-08 this file read neither, which made the
          # opt-in half a switch: setting PW_REQUIRE_OPERATOR=1 would have turned the PR gate red
          # and left the CAPTURE path — this workflow, the one you dispatch to take the operator
          # baselines — green over a capture that photographed none of them. Measured, not
          # theorised: run 34174895830 (2026-09-08, production) printed
          # `::error ... bounced off the /admin role floor` for all seven operator routes and the
          # `smoke` job still concluded SUCCESS (ADR-1266).
          #
          # Gated on `capture_shell` because a marketing-only dispatch asks for neither half, and a
          # ratchet that fires on a run that never wanted the shell is the red-X-that-means-nothing
          # this file's header refuses to ship. Read from EITHER tab for e2e.yml's stated reason.
          PW_REQUIRE_SHELL: ${{ inputs.capture_shell && (vars.PW_REQUIRE_SHELL || secrets.PW_REQUIRE_SHELL) || '' }}
          PW_REQUIRE_OPERATOR: ${{ inputs.capture_shell && (vars.PW_REQUIRE_OPERATOR || secrets.PW_REQUIRE_OPERATOR) || '' }}
        run: pnpm test:e2e:visual
      - name: Upload report + diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
