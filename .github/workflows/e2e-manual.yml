# E2E against a live URL, the MAINTAINER path. Dispatch-only: nothing here is ever TRIGGERED
# by a pull request.
#
# ⚠️ THAT IS NOT THE SAME AS "never appears on a pull request", which is what this header
# claimed until 2026-08-11 and is false. A check run attaches to the SHA it ran against, so
# dispatching this workflow on a branch that has an open PR surfaces `smoke`, `visual`,
# `update-a11y` and `update-baselines` on that PR's checklist. Observed on PR #2086: a
# marketing-only capture dispatch put a red `smoke` X on the PR, because `smoke` runs on every
# dispatch regardless of inputs and the branch still carried known a11y debt.
#
# It is harmless — none of these are required contexts, so they cannot block a merge — but it
# looks alarming and it is worth knowing before you dispatch against a live PR branch.
#
# It lives apart from e2e.yml on purpose. These jobs used to sit in the same file behind
# `if: github.event_name == 'workflow_dispatch'`, which meant every PR showed four checks
# reading "smoke — skipped", "visual — skipped", "update-baselines — skipped",
# "update-a11y — skipped". They were skipping because they are dispatch-only, but the
# checklist made it look like the preview gate had been disabled or the Vercel bypass
# secret was missing. A checklist that says "skipped" for a job that CANNOT run on a PR
# teaches people to ignore the word, and the one place it needs to mean something is
# e2e.yml, where "skipped" really does mean "nothing was tested".
#
# So: PRs see only the automatic e2e checks (pr-compare + lighthouse, ADR-936), never these.
# This file is what you reach for by hand.
#
#   base_url         where to point Playwright (a preview URL, or production)
#   run_visual       also run the @visual compare against committed baselines
#   update_baselines CAPTURE fresh @visual baselines and commit them to the branch
#   update_a11y      CAPTURE the @a11y ratchet counts and commit them to the branch
#   capture_shell    ALSO cover the member shell (/feed, the room, /settings, the Space
#                    console) by minting a session first — see below
#
# ── capture_shell, and why it is opt-in ───────────────────────────────────────────────────
# ⚠️ THIS PARAGRAPH DESCRIBED A WORLD THAT ENDED. It said the four member-shell surfaces "have
# NEVER had baselines" and that `update_baselines + capture_shell` writes "12 brand-new PNGs".
# Both were true the day it was written and neither is true now: the shell surfaces HAVE
# committed baselines, and on 2026-08-16 (#2141) `pr-compare` failed 8 of them as ordinary
# comparisons against existing PNGs while reporting "App shell covered: 4/4 surfaces, 16/16
# checks". Reading the old text cost that PR a cancelled capture run, which then left a PARTIAL
# baseline commit on the branch and a binary merge conflict for the next run to trip over.
#
# What is still true: sign-in is magic-link only, so the suite could not authenticate itself
# until the secrets landed (ADR-948's 🔴 amendment), and this flag is what mints a session per
# run and brings the shell into the matrix. It defaults OFF because a shell capture costs a
# session mint and roughly doubles the run, not because it is a first-ever baseline any more.
#
# 🔴 SO PICK THE FLAG BY WHAT MOVED. A public-surface recapture (`/discover` and friends) wants
# `update_baselines` ALONE — adding capture_shell rewrites shell PNGs your change never touched.
# A change to the header, the rails, the tab bar or the dock clearance DOES move the shell, and
# then you want both, because leaving them stale hands the next PR a failure it did not cause.
# `update_a11y + capture_shell` still seeds the shell's a11y debt so the first PR run reaching
# /feed does not fail on debt that predates it.
#
# Secrets it needs: SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL, PW_MEMBER_EMAIL.
# Repo variables it reads: PW_ROOM_PATH (default /channels), PW_SPACE_SLUG (adds the console).
# Full procedure: test/e2e/README.md § The member shell.
#
# ── capture_shell ALSO CARRIES THE OPERATOR CONSOLE (ADR-1128) ────────────────────────────
# Since 2026-08-25 the @visual matrix includes seven /admin routes (`OPERATOR_PATHS` in
# test/e2e/surfaces.ts, chosen by `node scripts/visual-surface-census.mjs`). They are member
# surfaces with a role floor, so they ride the SAME minted session — there is no separate
# input, and there must not be a second auth path.
#
# 🔴 THE ACCOUNT MUST BE PLATFORM STAFF or the 28 operator captures cannot be taken.
# requireAdminFloor() redirects a signed-in non-staff viewer to /feed, and the suite SKIPS
# with the cause named rather than photographing /feed seven times under seven admin names.
# A capture run in that state commits the member-shell PNGs and silently no operator ones —
# so before dispatching update_baselines for these, confirm PW_MEMBER_EMAIL's account clears
# the floor. The job summary's shell-coverage table names every /admin route it could not
# photograph; read it before believing the capture was complete (backlog HYG-027).
#
# ⚠️ AS OF 2026-09-08 IT IS STILL NOT, AND THAT IS MEASURED RATHER THAN ASSUMED. Run
# 34174895830 pointed this workflow at production with capture_shell on. The mint step printed
# `is signed in but is NOT platform staff: /admin redirected to /feed`, all 21 operator @a11y
# tests skipped, and the reporter printed
# `::error ... bounced off the /admin role floor` naming all seven routes — and the `smoke` job
# concluded SUCCESS anyway, because this file read neither PW_REQUIRE_SHELL nor
# PW_REQUIRE_OPERATOR. It reads both now, gated on capture_shell (ADR-1266), so the owner's one
# repo variable makes the CAPTURE path red too and "read the summary before believing it" is
# backed by a gate rather than by attention. That is the standing rule: every fail-safe needs a
# gate that notices it fired.
#
# Since 2026-09-07 (ADR-1239) the SAME seven routes are in the @a11y matrix, held to 21
# READINGS of 0 in test/e2e/a11y-baselines.json that nothing has measured: the zero-tolerance
# join rule written down, not a count. The mint step now prints whether the account clears
# the floor as soon as the session exists. A capture_shell + update_a11y dispatch with a STAFF
# account is how to see all 21 real counts in one log: the merge below writes a 0 as observed
# and REFUSES a rise (this workflow never passes --force, and LIVE-023 holds the file at zero
# ceilings), so operator debt is fixed or waived, never seeded. With a non-staff account the
# a11y capture records nothing for /admin and the 0s stay as they are.
#
# ⚠️ THIS PARAGRAPH USED TO SAY "confirm ... has web_role = 'admin'", AND THAT WAS WRONG TWICE
# OVER — measured against production 2026-08-25 while working SCAN-507:
#   1. The floor is `isStaff(profile.webRole)` (lib/core/roles.ts:77), which admits 'admin'
#      OR 'janitor'. A janitor clears it.
#   2. Production holds ZERO accounts at web_role = 'admin'. The whole staff axis is:
#      janitor × 2 — `danieltyack` (the owner) and `moderation` (Vera, who has no auth_user_id
#      and cannot sign in) — and web_role 'none' × 54.
# So read literally, the old instruction was unfollowable: it named a role nobody holds. The
# real precondition is that PW_MEMBER_EMAIL is the ONE human account on the staff axis. A
# comment that tells you to check a thing that cannot be true is worse than no comment, because
# you check it, find nothing, and cannot tell whether that means "not set up" or "doc is wrong".
#
# ── THE THIRD VIEWPORT, AND WHICH FLAG WRITES IT (ADR-1270) ───────────────────────────────
# Since 2026-09-08 `playwright.config.ts` carries a `narrow` project (320x568) alongside desktop
# and mobile. It photographs and only photographs — a per-project `testMatch` limits it to
# `visual.spec.ts` — and inside that file it captures two things, which land under DIFFERENT
# flags. Read this before deciding a capture was complete:
#
#   `update_baselines` ALONE            → 4 PNGs, `header-band--*-narrow.png`. The band is an
#                                         ANONYMOUS surface (`/`, viewportOnly), so it needs no
#                                         session, and it is captured at 320 ONLY: at 1280 and 390
#                                         the full-page marketing baselines already gate the same
#                                         pixels under the absolute tolerance (ADR-1258).
#   `update_baselines + capture_shell`  → those 4, plus 8 more, `app-*--dawn-{light,dark}-narrow.png`
#                                         (4 member-shell surfaces x 2 modes). Twelve in total.
#
# The 16 public surfaces and the 7 operator routes are SKIPPED under `narrow`, with the reason on
# each skip — so a narrow column of skips in the report is the design, not a missing session.
#
# ⚠️ `viewportOnly` now has THREE exact heights, not two: 800 desktop, 844 mobile, 568 narrow.
# `baseline-distinctness.test.ts` fails immediately when the flag and the committed baseline
# disagree, so the flag and the capture still have to move together (ADR-1265).
#
# FIRST CAPTURE OF THE OPERATOR BASELINES (28 PNGs — 7 routes x 2 modes x 2 viewports):
#     base_url = <the PR's preview URL>, capture_shell ✔, update_baselines ✔
# Expect the commit to name `admin*` files only IF nothing else has changed since the last
# capture. A capture rewrites every PNG whose page renders differently from the day that file
# was taken, so anything else in the diff is a page that changed since then — read it with
# `pnpm visual:bands origin/main HEAD` before deciding whether it is a regression, a copy change
# to take, or live data (ADR-1273; ADR-948's attribution property still holds per file).
#
# ⚠️ WHETHER THE COMMIT THIS MAKES RE-RUNS CI IS NOT RELIABLE — DO NOT PLAN AROUND EITHER ANSWER.
#
# Both capture jobs push with GITHUB_TOKEN. GitHub suppresses workflow runs triggered by that
# token so an Action cannot recurse into itself, and on PR #2026 (2026-08-05) that is exactly
# what happened: commit 6ced257 re-captured all 64 baselines and produced exactly one check run.
#
# 🔴 It did NOT happen on PR #2086 (2026-08-11). The capture commit 7aa2ded fired a full
# `pull_request: synchronize` — `pr-compare` ran against the new baselines and reported 32
# visual failures down to 1. Same workflow, same token, opposite outcome, six days apart. So
# this file has now been observed both ways and cannot tell you which you will get.
#
# WHAT TO DO INSTEAD OF BELIEVING EITHER BRANCH: after a capture lands, LOOK at the PR's
# checklist for the new SHA. If a run fired, read it. If none did, push a real commit — merging
# the base branch in is the useful one, since it fires `synchronize` AND brings you up to date.
# Do not re-run the PREVIOUS failed run: a re-run replays the same SHA, so it would judge the
# new baselines' commit against the old commit's tree.
name: e2e (manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (e.g. a Vercel preview URL). Required.'
        required: true
        default: ''
        type: string
      run_visual:
        description: 'Also run the @visual snapshot suite (needs committed baselines)'
        required: false
        default: false
        type: boolean
      update_baselines:
        description: 'CAPTURE fresh @visual baselines against base_url and commit them to the branch'
        required: false
        default: false
        type: boolean
      update_a11y:
        description: 'CAPTURE the @a11y ratchet baselines against base_url and commit them (falls are written down; a RISE fails the job rather than being laundered into the baseline)'
        required: false
        default: false
        type: boolean
      capture_shell:
        description: 'Include the MEMBER SHELL (/feed, the room, /settings, the Space console) AND the operator console (7 /admin routes, ADR-1128). Mints a session first; needs the SUPABASE_SERVICE_ROLE_KEY + PW_MEMBER_EMAIL secrets, and that account must be platform staff for the /admin half. Leave OFF for a marketing-only run.'
        required: false
        default: false
        type: boolean

# ── ONE CAPTURE AT A TIME, HERE TOO (LIVE-332) ────────────────────────────────────────────
# 🔴 THE DEFECT, measured. ADR-1331 put a TURNSTILE in front of e2e.yml's two preview-backed
# jobs so only one capture renders the surface list against the one shared database at a time.
# This file was not in scope, and the `concurrency` group below is not a substitute: it is keyed
# by ref and serialises only dispatches of the SAME ref. INSIDE one dispatch all four jobs
# below started at once, each minting its own member session and capturing the whole list. On
# 2026-09-14 the 23:28Z recapture (run 34909054841, capture_shell on, against PRODUCTION) ran
# its captures beside two PRs' pr-compare captures; the REST edge answered 503 to 11,042
# requests on /rest/v1/* between 23:33Z and 23:42Z, and the baselines that dispatch COMMITTED
# were photographed inside that window — 62 of them, superseded the next morning.
#
# Two changes, and they are different mechanisms for the two different overlaps:
#   1. ACROSS runs and workflows: every job below opens with the SAME turnstile step e2e.yml's
#      pr-compare and lighthouse carry, pointed at a lane that spans BOTH files, so a
#      maintainer capture waits for a PR capture and a PR capture waits for a maintainer one.
#   2. WITHIN one dispatch: the four jobs form a `needs:` chain (smoke → update-baselines →
#      update-a11y → visual). The turnstile cannot do this half — rule 1 deliberately ignores
#      the run's own jobs so e2e.yml's two can overlap (ADR-936) — and `needs:` is a hard
#      ordering GitHub enforces, where a shared wait could still run out its bound and proceed.
#
# ⚠️ A FULL DISPATCH IS NOW SEQUENTIAL, so wall clock is the sum rather than the max: roughly
# 30 + 45 + 45 + 45 minutes of capture plus whatever each turnstile waits. That is the price,
# and it is the right one: a dispatch that finishes sooner by photographing a degraded site has
# produced nothing but work.

# contents: write is needed ONLY by the two capture jobs' commit steps.
# actions: read is the turnstile's read of the two workflows' runs and jobs. A workflow-level
# `permissions:` block REPLACES the default set rather than adding to it, so without this line
# every turnstile below would read nothing, see nobody ahead, and wait on no one — the silent
# vacuous pass this file's header spends 80 lines refusing.
permissions:
  contents: write
  actions: read

concurrency:
  # Never cancel a maintainer capture: a half-written baseline set is worse than a slow one.
  #
  # ⚠️ AND IT SERIALISES ALMOST NOTHING: the group is per REF, so two dispatches on two branches
  # never queued behind each other, and the four jobs of ONE dispatch were never in it at all —
  # a workflow-level group holds the RUN, not the job. That is what the turnstile and the
  # `needs:` chain are for (LIVE-332); this group is only the same-ref supersede rule.
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # THE HEAD OF THE CHAIN. Runs on every dispatch, so the three conditional jobs below can hang
  # their `needs:` off it and off each other without a skip ever breaking the chain.
  smoke:
    # Manual path only — the PR path runs its own smoke step against the resolved preview.
    runs-on: ubuntu-latest
    # 30 is the suite's own budget, unchanged; the 90 on top is the most the turnstile may spend
    # waiting (TURNSTILE_MAX_MINUTES), exactly as e2e.yml's two jobs carry it. Raise both or neither.
    timeout-minutes: 120
    steps:
      # ── A DISPATCH THAT CANNOT COMMIT IS REFUSED BEFORE IT SPENDS ANYTHING (HYG-089, ADR-1352) ──
      # 🔴 THE DEFECT, measured. Run 34904181882 (2026-09-14, 22:27:16Z to 22:34:07Z) was dispatched
      # on `main` with update_baselines on. Seven minutes and a 110 MB artifact later that run's commit
      # step died on "Changes must be made through a pull request": `main` is protected, and
      # GITHUB_TOKEN is not exempt from a protection rule. The capture was re-dispatched on a branch
      # and the first one was pure waste — no baseline, no reading, one capture lane held shut.
      #
      # THE RULE IS NARROWER THAN "REFUSE main": refuse a dispatch that would COMMIT. Exactly two
      # jobs here carry a `git push` — update-baselines and update-a11y — and each runs only when
      # its own input is set, so `update_baselines || update_a11y` IS the committing dispatch.
      #
      # A READ-ONLY DISPATCH ON A PROTECTED REF STAYS LEGAL, and that is not politeness: it is the
      # only way to get some readings at all. `workflow_dispatch` runs the workflow file AS IT
      # EXISTS ON THE DISPATCHED REF, so a rule that has just merged can only be exercised on
      # `main`. Run 34940970232 (2026-09-15, on `main`) is the control ADR-1346 owed and was taken
      # that way. `smoke` against production and a `visual` compare against committed baselines are
      # both still one dispatch away, on any ref.
      #
      # ⚠️ IT IS A STEP THAT FAILS, NEVER A JOB-LEVEL `if:` THAT SKIPS, and that is load-bearing
      # rather than stylistic. A skipped job reports `skipped` — the exact word ADR-1346's control
      # reads to tell "the chain let me run" from "a skipped need skipped me". A job-level guard
      # would have made that control unreadable. A failing FIRST step leaves the job visibly
      # created, scheduled and started, so every job-level reading survives; only the seconds after
      # it are not spent.
      #
      # ⚠️ WHY A LITERAL BRANCH NAME AND NOT AN API READ OF "is this ref protected". Reading
      # protection needs `administration: read`, which this file does not grant and should not — it
      # would widen the token for every job here to learn a fact that is static. Worse, the
      # branch-protection endpoint 404s BOTH for an unprotected branch and for a token that cannot
      # see it, so the guard could not tell "not protected" from "cannot look": failing open is the
      # vacuous pass this file spends eighty lines refusing, and failing closed refuses every branch
      # dispatch, i.e. everything. WHAT THE LITERAL TEST MISSES, stated now rather than discovered
      # later: any OTHER protected ref. A committing dispatch on a protected release branch would
      # still spend the capture and still die at the push. PROTECTED_BRANCH is the one place to add
      # one, and scripts/e2e-preview-gate.test.ts reads it from here rather than restating it.
      #
      # It reads GITHUB_REF_NAME because that is the value the push itself targets
      # (`git push origin "HEAD:${GITHUB_REF_NAME}"`, in the two committing jobs), so it asks the
      # same question the push will: can this ref be written? `github.ref` would read `refs/tags/...`
      # on a tag dispatch and miss that the push still lands on a BRANCH of that name.
      #
      # FIRST, BEFORE THE TURNSTILE, and that order is load-bearing twice. The turnstile waits up to
      # 90 minutes, and WHILE IT WAITS it makes every other capture in both workflows queue behind
      # this run. A guard sitting behind it would burn the wait and hold the lane shut on behalf of a
      # run that was never going to be allowed to commit.
      - name: Refuse a committing dispatch on a protected ref
        env:
          PROTECTED_BRANCH: main
          # True exactly when this dispatch asked for something that ends in a `git push`. In the two
          # committing jobs it is necessarily true — each runs only when its own input is set — so
          # there this step reduces to the ref test, which is why all three copies can be identical.
          WOULD_COMMIT: ${{ inputs.update_baselines || inputs.update_a11y }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME:-}" = "${PROTECTED_BRANCH}" ] && [ "${WOULD_COMMIT}" = "true" ]; then
            echo "::error title=committing dispatch on a protected ref::This dispatch would commit captures to ${GITHUB_REF_NAME}, which is protected, so the push at the end of the capture is refused by branch protection after the entire capture has been spent (run 34904181882: seven minutes, 110 MB, nothing kept). Re-dispatch with the ref set to the BRANCH these baselines belong on. A read-only dispatch, update_baselines and update_a11y both off, is allowed on any ref and is how ADR-1346's control was taken."
            exit 1
          fi
          echo "ref=${GITHUB_REF_NAME:-} would_commit=${WOULD_COMMIT}: nothing in this dispatch pushes to ${PROTECTED_BRANCH}, so the capture may proceed."
      # THE TURNSTILE (ADR-1331, extended to this file by LIVE-332). Byte-identical to the
      # step that opens pr-compare and lighthouse in e2e.yml, and pointed at the same lane:
      # every capture job of BOTH workflows, so a maintainer capture waits for a PR capture
      # and a PR capture waits for a maintainer one. It is the FIRST step, before checkout,
      # because an inline github-script step needs no working tree and the wait should happen
      # before we pay for an install. It never fails the job (rule 5).
      #
      # ⚠️ IT IS NOW THE SECOND STEP: the protected-ref refusal above runs first, on purpose. A
      # dispatch that can never commit must not spend this wait, and must not make every other
      # capture in both workflows queue behind it while it waits (HYG-089, ADR-1352).
      #
      # It does NOT serialise this run's OWN jobs — rule 1 skips them on purpose, so that
      # e2e.yml's two jobs can still overlap. The needs: chain above does that job here.
      - name: Turnstile (wait for other captures)
        id: turnstile
        uses: actions/github-script@v9
        env:
          TURNSTILE_JOB: smoke
          TURNSTILE_PEERS: pr-compare,lighthouse,smoke,update-baselines,update-a11y,visual
          TURNSTILE_WORKFLOWS: e2e.yml,e2e-manual.yml
          TURNSTILE_MAX_MINUTES: '90'
          TURNSTILE_POLL_SECONDS: '30'
        with:
          script: |
            // THE TURNSTILE. Rules 1 to 5 are in the comment block above this job's timeout.
            const jobName = process.env.TURNSTILE_JOB
            // THE LANE this job queues in: every job name that counts as a capture, and every
            // workflow file to look for those jobs in. Both are comma-separated. TURNSTILE_PEERS
            // falls back to this job's own name, which is ADR-1331's original behaviour;
            // TURNSTILE_WORKFLOWS has no fallback, and the block below says so out loud.
            const peers = new Set((process.env.TURNSTILE_PEERS || jobName).split(',').map((name) => name.trim()).filter(Boolean))
            const workflowFiles = (process.env.TURNSTILE_WORKFLOWS || '').split(',').map((file) => file.trim()).filter(Boolean)
            const maxMinutes = Number(process.env.TURNSTILE_MAX_MINUTES)
            const pollSeconds = Number(process.env.TURNSTILE_POLL_SECONDS)
            const { owner, repo } = context.repo
            const started = Date.now()
            const deadline = started + maxMinutes * 60_000
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const elapsed = () => ((Date.now() - started) / 60_000).toFixed(1)
            // A job is past its turnstile when this step (matched by name, so every job in every
            // lane shares the one definition) has completed. Before that it is waiting, not capturing.
            const isTurnstile = (step) => /^Turnstile/.test(step.name || '')
            if (workflowFiles.length === 0) {
              // A turnstile with nothing to poll clears on poll 1 having looked at nothing: the
              // vacuous pass this repo refuses, wearing a green tick. It may not fail the job
              // (rule 5), so it says so where a reader will see it, and
              // scripts/e2e-preview-gate.test.ts is the gate that stops the omission reaching a
              // runner in the first place.
              core.warning(`turnstile: TURNSTILE_WORKFLOWS is empty, so ${jobName} polled nothing and waited on nobody`)
              await core.summary
                .addRaw(`### Turnstile polled nothing\n\nThis \`${jobName}\` declared no TURNSTILE_WORKFLOWS, so the one-capture-at-a-time rule did not apply to it (LIVE-332).\n`)
                .write()
            }
            let poll = 0
            for (;;) {
              poll += 1
              const ahead = []
              try {
                for (const workflowFile of workflowFiles) {
                  // Only runs still in progress: a completed run (success, failure, CANCELLED)
                  // holds no load, so the workflow-level group's supersede on the same PR and
                  // ADR-1328's cancellations both fall out of the read (rule 2).
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner, repo, workflow_id: workflowFile, status: 'in_progress', per_page: 100,
                  })
                  for (const run of runs) {
                    if (run.id === context.runId) continue // rule 1: never this run's own jobs
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                    })
                    for (const job of jobs) {
                      // Only the job names in THIS job's lane, so pr-compare and lighthouse keep
                      // taking separate turns and one run's two jobs still overlap (ADR-936). A
                      // completed job, whatever its conclusion, holds nothing (rule 2).
                      if (!peers.has(job.name) || job.status === 'completed') continue
                      const gate = (job.steps || []).find(isTurnstile)
                      const capturing = gate ? gate.status === 'completed' : job.status === 'in_progress'
                      const older = run.run_number < context.runNumber
                      // Rule 3: a run is AHEAD when it is already capturing, or when it is still
                      // waiting and carries the lower run number. Two waiting runs therefore
                      // never wait on each other: the older proceeds, the newer waits for it.
                      // Run numbers are per WORKFLOW FILE, so across two files they are not one
                      // series: between two waiting runs the file with the lower numbers wins, and
                      // e2e-manual.yml has far fewer runs than e2e.yml, which hands a maintainer
                      // capture priority over a merely queued PR capture. Deliberate, and it is a
                      // strict order either way, so no two runs can end up waiting on each other.
                      if (capturing || older) {
                        ahead.push(`${job.name} run #${run.run_number} (${run.head_branch}: ${capturing ? 'capturing' : 'waiting, older'})`)
                      }
                    }
                  }
                }
              } catch (error) {
                // An unreadable API is not a clear road; it is one more thing to wait on,
                // and the bound below still ends the wait (rule 5).
                ahead.push(`the Actions API (unreadable: ${error.message})`)
              }
              if (ahead.length === 0) {
                core.info(`turnstile: clear on poll ${poll} after ${elapsed()} min; ${jobName} proceeds`)
                break
              }
              if (Date.now() >= deadline) {
                // Rule 5: the load rule is a ceiling, not a gate. Say so and go.
                core.warning(`turnstile: bound of ${maxMinutes} min reached after ${poll} polls, still waiting on ${ahead.join(', ')}; ${jobName} proceeds anyway`)
                await core.summary
                  .addRaw(`### Turnstile bound reached\n\nThis \`${jobName}\` waited ${maxMinutes} min for ${ahead.join(', ')} and proceeded anyway: the one-capture-at-a-time rule is a ceiling, not a gate (ADR-1331).\n`)
                  .write()
                break
              }
              // Rule 4: one line per poll, naming what it waits on.
              core.info(`turnstile: poll ${poll} (${elapsed()} min): waiting on ${ahead.join(', ')}; next look in ${pollSeconds}s`)
              await sleep(pollSeconds * 1000)
            }
            core.setOutput('waited_minutes', elapsed())

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
