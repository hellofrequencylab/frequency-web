  update-baselines:
    # SECOND IN THE CHAIN (LIVE-332). It used to start beside `smoke`, and the two of them then
    # minted two sessions and captured the same ~160 surfaces at the same time.
    needs: smoke
    # `!cancelled()` rather than a bare `inputs.…`, and this is load-bearing: GitHub prepends an
    # implicit `success()` to a job `if:` that names no status function, so a bare input check
    # would ALSO make this job wait for smoke to pass. It never did before, and a capture that
    # silently stops happening because the smoke suite found a11y debt is the same silence in a
    # new wrapper. `always()` is the other candidate and is wrong: it captures through a
    # cancellation, which is the one time nobody wants the load.
    if: ${{ !cancelled() && inputs.update_baselines }}
    runs-on: ubuntu-latest
    # 45 for the capture (unchanged) plus the turnstile's 90-minute bound.
    timeout-minutes: 135
    steps:
      # ── A DISPATCH THAT CANNOT COMMIT IS REFUSED BEFORE IT SPENDS ANYTHING (HYG-089, ADR-1352) ──
      # 🔴 THE DEFECT, measured. Run 34904181882 (2026-09-14, 22:27:16Z to 22:34:07Z) was dispatched
      # on `main` with update_baselines on. Seven minutes and a 110 MB artifact later that run's commit
      # step died on "Changes must be made through a pull request": `main` is protected, and
      # GITHUB_TOKEN is not exempt from a protection rule. The capture was re-dispatched on a branch
      # and the first one was pure waste — no baseline, no reading, one capture lane held shut.
      #
      # THE RULE IS NARROWER THAN "REFUSE main": refuse a dispatch that would COMMIT. Exactly two
      # jobs here carry a `git push` — update-baselines and update-a11y — and each runs only when
      # its own input is set, so `update_baselines || update_a11y` IS the committing dispatch.
      #
      # A READ-ONLY DISPATCH ON A PROTECTED REF STAYS LEGAL, and that is not politeness: it is the
      # only way to get some readings at all. `workflow_dispatch` runs the workflow file AS IT
      # EXISTS ON THE DISPATCHED REF, so a rule that has just merged can only be exercised on
      # `main`. Run 34940970232 (2026-09-15, on `main`) is the control ADR-1346 owed and was taken
      # that way. `smoke` against production and a `visual` compare against committed baselines are
      # both still one dispatch away, on any ref.
      #
      # ⚠️ IT IS A STEP THAT FAILS, NEVER A JOB-LEVEL `if:` THAT SKIPS, and that is load-bearing
      # rather than stylistic. A skipped job reports `skipped` — the exact word ADR-1346's control
      # reads to tell "the chain let me run" from "a skipped need skipped me". A job-level guard
      # would have made that control unreadable. A failing FIRST step leaves the job visibly
      # created, scheduled and started, so every job-level reading survives; only the seconds after
      # it are not spent.
      #
      # ⚠️ WHY A LITERAL BRANCH NAME AND NOT AN API READ OF "is this ref protected". Reading
      # protection needs `administration: read`, which this file does not grant and should not — it
      # would widen the token for every job here to learn a fact that is static. Worse, the
      # branch-protection endpoint 404s BOTH for an unprotected branch and for a token that cannot
      # see it, so the guard could not tell "not protected" from "cannot look": failing open is the
      # vacuous pass this file spends eighty lines refusing, and failing closed refuses every branch
      # dispatch, i.e. everything. WHAT THE LITERAL TEST MISSES, stated now rather than discovered
      # later: any OTHER protected ref. A committing dispatch on a protected release branch would
      # still spend the capture and still die at the push. PROTECTED_BRANCH is the one place to add
      # one, and scripts/e2e-preview-gate.test.ts reads it from here rather than restating it.
      #
      # It reads GITHUB_REF_NAME because that is the value the push itself targets
      # (`git push origin "HEAD:${GITHUB_REF_NAME}"`, in the two committing jobs), so it asks the
      # same question the push will: can this ref be written? `github.ref` would read `refs/tags/...`
      # on a tag dispatch and miss that the push still lands on a BRANCH of that name.
      #
      # FIRST, BEFORE THE TURNSTILE, and that order is load-bearing twice. The turnstile waits up to
      # 90 minutes, and WHILE IT WAITS it makes every other capture in both workflows queue behind
      # this run. A guard sitting behind it would burn the wait and hold the lane shut on behalf of a
      # run that was never going to be allowed to commit.
      - name: Refuse a committing dispatch on a protected ref
        env:
          PROTECTED_BRANCH: main
          # True exactly when this dispatch asked for something that ends in a `git push`. In the two
          # committing jobs it is necessarily true — each runs only when its own input is set — so
          # there this step reduces to the ref test, which is why all three copies can be identical.
          WOULD_COMMIT: ${{ inputs.update_baselines || inputs.update_a11y }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME:-}" = "${PROTECTED_BRANCH}" ] && [ "${WOULD_COMMIT}" = "true" ]; then
            echo "::error title=committing dispatch on a protected ref::This dispatch would commit captures to ${GITHUB_REF_NAME}, which is protected, so the push at the end of the capture is refused by branch protection after the entire capture has been spent (run 34904181882: seven minutes, 110 MB, nothing kept). Re-dispatch with the ref set to the BRANCH these baselines belong on. A read-only dispatch, update_baselines and update_a11y both off, is allowed on any ref and is how ADR-1346's control was taken."
            exit 1
          fi
          echo "ref=${GITHUB_REF_NAME:-} would_commit=${WOULD_COMMIT}: nothing in this dispatch pushes to ${PROTECTED_BRANCH}, so the capture may proceed."
      # THE TURNSTILE (ADR-1331, extended to this file by LIVE-332). Byte-identical to the
      # step that opens pr-compare and lighthouse in e2e.yml, and pointed at the same lane:
      # every capture job of BOTH workflows, so a maintainer capture waits for a PR capture
      # and a PR capture waits for a maintainer one. It is the FIRST step, before checkout,
      # because an inline github-script step needs no working tree and the wait should happen
      # before we pay for an install. It never fails the job (rule 5).
      #
      # ⚠️ IT IS NOW THE SECOND STEP: the protected-ref refusal above runs first, on purpose. A
      # dispatch that can never commit must not spend this wait, and must not make every other
      # capture in both workflows queue behind it while it waits (HYG-089, ADR-1352).
      #
      # It does NOT serialise this run's OWN jobs — rule 1 skips them on purpose, so that
      # e2e.yml's two jobs can still overlap. The needs: chain above does that job here.
      - name: Turnstile (wait for other captures)
        id: turnstile
        uses: actions/github-script@v9
        env:
          TURNSTILE_JOB: update-baselines
          TURNSTILE_PEERS: pr-compare,lighthouse,smoke,update-baselines,update-a11y,visual
          TURNSTILE_WORKFLOWS: e2e.yml,e2e-manual.yml
          TURNSTILE_MAX_MINUTES: '90'
          TURNSTILE_POLL_SECONDS: '30'
        with:
          script: |
            // THE TURNSTILE. Rules 1 to 5 are in the comment block above this job's timeout.
            const jobName = process.env.TURNSTILE_JOB
            // THE LANE this job queues in: every job name that counts as a capture, and every
            // workflow file to look for those jobs in. Both are comma-separated. TURNSTILE_PEERS
            // falls back to this job's own name, which is ADR-1331's original behaviour;
            // TURNSTILE_WORKFLOWS has no fallback, and the block below says so out loud.
            const peers = new Set((process.env.TURNSTILE_PEERS || jobName).split(',').map((name) => name.trim()).filter(Boolean))
            const workflowFiles = (process.env.TURNSTILE_WORKFLOWS || '').split(',').map((file) => file.trim()).filter(Boolean)
            const maxMinutes = Number(process.env.TURNSTILE_MAX_MINUTES)
            const pollSeconds = Number(process.env.TURNSTILE_POLL_SECONDS)
            const { owner, repo } = context.repo
            const started = Date.now()
            const deadline = started + maxMinutes * 60_000
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
            const elapsed = () => ((Date.now() - started) / 60_000).toFixed(1)
            // A job is past its turnstile when this step (matched by name, so every job in every
            // lane shares the one definition) has completed. Before that it is waiting, not capturing.
            const isTurnstile = (step) => /^Turnstile/.test(step.name || '')
            if (workflowFiles.length === 0) {
              // A turnstile with nothing to poll clears on poll 1 having looked at nothing: the
              // vacuous pass this repo refuses, wearing a green tick. It may not fail the job
              // (rule 5), so it says so where a reader will see it, and
              // scripts/e2e-preview-gate.test.ts is the gate that stops the omission reaching a
              // runner in the first place.
              core.warning(`turnstile: TURNSTILE_WORKFLOWS is empty, so ${jobName} polled nothing and waited on nobody`)
              await core.summary
                .addRaw(`### Turnstile polled nothing\n\nThis \`${jobName}\` declared no TURNSTILE_WORKFLOWS, so the one-capture-at-a-time rule did not apply to it (LIVE-332).\n`)
                .write()
            }
            let poll = 0
            for (;;) {
              poll += 1
              const ahead = []
              try {
                for (const workflowFile of workflowFiles) {
                  // Only runs still in progress: a completed run (success, failure, CANCELLED)
                  // holds no load, so the workflow-level group's supersede on the same PR and
                  // ADR-1328's cancellations both fall out of the read (rule 2).
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner, repo, workflow_id: workflowFile, status: 'in_progress', per_page: 100,
                  })
                  for (const run of runs) {
                    if (run.id === context.runId) continue // rule 1: never this run's own jobs
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
                    })
                    for (const job of jobs) {
                      // Only the job names in THIS job's lane, so pr-compare and lighthouse keep
                      // taking separate turns and one run's two jobs still overlap (ADR-936). A
                      // completed job, whatever its conclusion, holds nothing (rule 2).
                      if (!peers.has(job.name) || job.status === 'completed') continue
                      const gate = (job.steps || []).find(isTurnstile)
                      const capturing = gate ? gate.status === 'completed' : job.status === 'in_progress'
                      const older = run.run_number < context.runNumber
                      // Rule 3: a run is AHEAD when it is already capturing, or when it is still
                      // waiting and carries the lower run number. Two waiting runs therefore
                      // never wait on each other: the older proceeds, the newer waits for it.
                      // Run numbers are per WORKFLOW FILE, so across two files they are not one
                      // series: between two waiting runs the file with the lower numbers wins, and
                      // e2e-manual.yml has far fewer runs than e2e.yml, which hands a maintainer
                      // capture priority over a merely queued PR capture. Deliberate, and it is a
                      // strict order either way, so no two runs can end up waiting on each other.
                      if (capturing || older) {
                        ahead.push(`${job.name} run #${run.run_number} (${run.head_branch}: ${capturing ? 'capturing' : 'waiting, older'})`)
                      }
                    }
                  }
                }
              } catch (error) {
                // An unreadable API is not a clear road; it is one more thing to wait on,
                // and the bound below still ends the wait (rule 5).
                ahead.push(`the Actions API (unreadable: ${error.message})`)
              }
              if (ahead.length === 0) {
                core.info(`turnstile: clear on poll ${poll} after ${elapsed()} min; ${jobName} proceeds`)
                break
              }
              if (Date.now() >= deadline) {
                // Rule 5: the load rule is a ceiling, not a gate. Say so and go.
                core.warning(`turnstile: bound of ${maxMinutes} min reached after ${poll} polls, still waiting on ${ahead.join(', ')}; ${jobName} proceeds anyway`)
                await core.summary
                  .addRaw(`### Turnstile bound reached\n\nThis \`${jobName}\` waited ${maxMinutes} min for ${ahead.join(', ')} and proceeded anyway: the one-capture-at-a-time rule is a ceiling, not a gate (ADR-1331).\n`)
                  .write()
                break
              }
              // Rule 4: one line per poll, naming what it waits on.
              core.info(`turnstile: poll ${poll} (${elapsed()} min): waiting on ${ahead.join(', ')}; next look in ${pollSeconds}s`)
              await sleep(pollSeconds * 1000)
            }
            core.setOutput('waited_minutes', elapsed())

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Same opt-in mint as the smoke job. THIS is the job that takes the member shell's
      # first-ever baselines: 12 PNGs (3 surfaces × 2 modes × 2 viewports), or 16 with
      # PW_SPACE_SLUG set. Expect the commit below to be large the first time and to name
      # only `app-*` files; anything else in that diff is a regression, not a capture
      # (ADR-948's attribution property).
      - name: Mint the member session
        id: session
        if: ${{ inputs.capture_shell }}
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${PW_MEMBER_EMAIL:-}" ]; then
            echo "::error title=capture_shell::SUPABASE_SERVICE_ROLE_KEY / PW_MEMBER_EMAIL are not configured, so no member session can be minted. Add them (test/e2e/README.md § The member shell) or re-run with capture_shell off."
            exit 1
          fi
          pnpm e2e:session
          echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"

      - name: Capture baselines
        env:
          PW_BASE_URL: ${{ inputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
          # THE SAME TWO OPT-IN RATCHETS THE PR GATE READS (e2e.yml), so the owner's ONE repo
          # variable covers BOTH paths. Until 2026-09-08 this file read neither, which made the
          # opt-in half a switch: setting PW_REQUIRE_OPERATOR=1 would have turned the PR gate red
          # and left the CAPTURE path — this workflow, the one you dispatch to take the operator
          # baselines — green over a capture that photographed none of them. Measured, not
          # theorised: run 34174895830 (2026-09-08, production) printed
          # `::error ... bounced off the /admin role floor` for all seven operator routes and the
          # `smoke` job still concluded SUCCESS (ADR-1266).
          #
          # Gated on `capture_shell` because a marketing-only dispatch asks for neither half, and a
          # ratchet that fires on a run that never wanted the shell is the red-X-that-means-nothing
          # this file's header refuses to ship. Read from EITHER tab for e2e.yml's stated reason.
          PW_REQUIRE_SHELL: ${{ inputs.capture_shell && (vars.PW_REQUIRE_SHELL || secrets.PW_REQUIRE_SHELL) || '' }}
          PW_REQUIRE_OPERATOR: ${{ inputs.capture_shell && (vars.PW_REQUIRE_OPERATOR || secrets.PW_REQUIRE_OPERATOR) || '' }}
        run: pnpm test:e2e:update
      # ── Re-stamp what the PNGs just photographed (LIVE-040, ADR-1272) ────────────────────────
      # test/e2e/template-fingerprints.json records the RENDER INPUT each committed baseline
      # depicts, and test/e2e/template-fingerprints.test.ts fails when a template drifts from it.
      # Regenerating here is what keeps the two halves in one commit: a capture that landed PNGs
      # and left the fingerprints behind would re-create, in a new file, exactly the staleness this
      # replaced.
      #
      # ⚠️ IT STAMPS THE BRANCH'S SOURCE, AND THE CAPTURE PHOTOGRAPHED `base_url`. Those are the
      # same thing only when base_url serves this branch. Dispatching against PRODUCTION from a
      # branch that edits a template therefore records a fingerprint no PNG has ever shown - point
      # base_url at the branch's PREVIEW whenever the branch touches lib/page-editor/templates/.
      #
      # Deliberately NOT `always()`, unlike the commit step below. A capture that died part-way
      # still lands the PNGs it got, and that is the right call for pictures; stamping every
      # fingerprint as current on the back of a PARTIAL capture is the opposite, because it claims
      # baselines that were never retaken now depict the source. On a failed capture the stamps
      # stay where they were and the gate stays honestly red.
      - name: Re-stamp the template fingerprints
        run: pnpm gen:visual-fingerprints
      - name: Commit baselines to the branch
        # The runner commits the captures directly: artifact downloads redirect to a
        # storage host the agent sandbox's network policy blocks, so an artifact-only
        # hand-off dead-ends. always(): a single flaky surface must not discard the
        # other captures — the job stays red on real failures, but partials still land.
        #
        # 🔴 AND `always()` IS EXACTLY WHY THIS STEP NEEDS A GATE OF ITS OWN (LIVE-333, ADR-1351).
        # The row that filed the degraded-capture guard assumed the step ORDER already refused a
        # bad commit — "the runner exits non-zero before the commit step". It does not, and this
        # `if: always()` is the line that says so: a non-zero `pnpm test:e2e:update` skips the
        # fingerprint re-stamp above (no `always()` there) and then runs THIS step anyway. That
        # is the right call for one flaky surface and the wrong one for a degraded deployment,
        # where the whole run is suspect and the PNGs that DID land were taken at the edge of a
        # 5xx window. So the two cases are told apart by a marker the capture writes: the
        # refusal in `assertNoServerErrors` (test/e2e/surfaces.ts) appends one line per refused
        # surface, and the shell below refuses the commit when that file is non-empty. Nothing
        # else about this step changes, so a flake still lands its partials.
        #
        # ⚠️ THIS COMMIT DOES NOT RE-TRIGGER CI. GitHub deliberately suppresses workflow
        # runs for pushes made with GITHUB_TOKEN, so the freshly captured baselines land on
        # the branch with ZERO checks against them and the PR's last judged SHA stays the
        # commit BEFORE the capture. That reads exactly like "CI passed on the new
        # baselines" when nothing evaluated them. Push any commit of your own afterwards
        # (or re-run the PR's checks) to get the branch judged on what it now contains.
        if: always()
        run: |
          # ── JOB-NEVER-STARTED STAND-DOWN (HYG-094, ADR-1423) ────────────────────────────────
          # always() still fires after the protected-ref guard refuses. Checkout is skipped, so
          # the first git call used to die with "fatal: not in a git directory" and a refused
          # dispatch reported two red steps. A work-tree test, not a message that mentions a
          # refusal: "the capture ran and partly failed" still has a .git (dir or file) and
          # proceeds to the degraded-capture check. "This job never started" does not.
          if [ ! -d .git ] && [ ! -f .git ]; then
            echo "Stand down: no work tree. This job never checked out (protected-ref refusal or skipped capture). Nothing to commit."
            exit 0
          fi
          # ── THE DEGRADED-CAPTURE REFUSAL (LIVE-333, ADR-1351) ───────────────────────────────
          # One line per surface the capture refused because the deployment answered it with a
          # 5xx. A non-empty file means the pictures this run took describe an outage, and
          # committing them makes the outage the baseline every later comparison is measured
          # against — which is what happened on 2026-09-14 (run 34909054841; 62 public
          # comparisons then failed at 1 to 2 percent across three runs).
          if [ -s test/e2e/.degraded-capture.jsonl ]; then
            echo "::error title=degraded capture::The deployment answered a capture with a server error, so NOTHING is committed. Re-dispatch against a healthy deployment; the refused surfaces are listed below and the full capture is in the debug artifact."
            cat test/e2e/.degraded-capture.jsonl
            exit 1
          fi
          git config user.email noreply@anthropic.com
          git config user.name Claude
          # ⚠️ `test/e2e/__screenshots__/` CARRIES THE CAPTURE STAMP AS WELL AS THE PNGs (LIVE-213,
          # ADR-1525). `captured-on.json` names the environment this capture photographed, the run
          # writes it beside the pictures, and this `git add` takes it for free, which is why it
          # lives in the folder rather than next to it. If this dispatch pointed `base_url` at an
          # environment the committed set was NOT photographed on, the capture refused BEFORE the
          # first navigation and there is nothing here to commit: see the message it printed. A
          # deliberate move of the whole set to another environment is a commit that deletes the
          # stamp, which is one visible line in a diff.
          git add test/e2e/__screenshots__/ test/e2e/template-fingerprints.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Visual baselines: capture against ${{ inputs.base_url }} (runner-committed)"
            # -X theirs: two captures queued on one ref (the concurrency group serialises them)
            # both rewrite the same PNGs, and a plain rebase cannot merge a binary, so the second
            # run died at "could not apply" with its capture only in the debug artifact (run
            # 34181623788, ADR-1273). During a rebase "theirs" is the commit being replayed, i.e.
            # THIS run's capture, which is the newer photograph and the one that should win.
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
