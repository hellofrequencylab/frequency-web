# The automatic preview gate for pull requests (UX maturity plan, Lift 6c).
#
# Runs on PRs that can move pixels, resolves the PR's own Vercel preview through the
# deployments API, then runs smoke + @a11y and the @visual compare against it.
#
# This workflow contributes exactly TWO checks to a PR: `pr-compare` (smoke + a11y +
# visual) and `lighthouse` (synthetic speed). It was one until 2026-08-04, when the speed
# gate moved into its own job so it stops serialising behind Playwright — ~25 minutes of
# wall clock became ~15 (ADR-936). Both always run; neither is ever a permanently-"skipped"
# row, which is the thing the one-check rule actually existed to prevent. The
# maintainer-triggered jobs (manual smoke, visual, baseline capture) still live in
# e2e-manual.yml so they cannot show up here — see that file's header for why that mattered.
#
# The gate SKIPS ITSELF (green, with a notice) unless VERCEL_AUTOMATION_BYPASS_SECRET is
# set. Without that secret Vercel's Deployment Protection serves its auth interstitial to
# Playwright, so every SSR route "renders" the wall: the visual suite would diff the wall
# against real baselines and the a11y suite would audit it. A red X meaning "the owner has
# not created a secret yet" trains people to ignore the check, which is the opposite of
# what a gate is for. When this one says "skipped", nothing was tested — and that is the
# only place in this repo where the word carries that meaning.
name: e2e

on:
  pull_request:
    branches: [main]
    # Same paths-filter shape db-tests.yml uses: only PRs that can actually change
    # rendering pay for a preview-backed run.
    paths:
      # 'app/**', not just app/globals.css. The filter used to list the stylesheet alone,
      # so a PR editing a PAGE never triggered this job -- including /pricing, the very
      # surface whose a11y debt this suite measured going 21 -> 0. The gate audits eight
      # routes under app/ and could not see a change to any of them.
      - 'app/**'
      - 'components/**'
      # 'lib/**', not just lib/page-editor: lib/layout/page-chrome.ts decides whether a route
      # gets a rail, which changes the geometry of every capture on it.
      - 'lib/**'
      # 🔴 proxy.ts, and this one is not a hypothetical. test/e2e/surfaces.ts:176 PARSES
      # proxy.ts at run time to read PROTECTED_PATHS, and uses it to decide which surfaces
      # are anon-reachable at all. Editing that array adds or removes whole surfaces from
      # both the visual and a11y matrices -- and proxy.ts is at the repo ROOT, so it matched
      # none of the globs here. A PR that only walls or unwalls a route therefore got NO e2e
      # run, and the next unrelated app/** PR inherited a wall of missing-baseline failures
      # it did not cause.
      - 'proxy.ts'
      # A font or logo swap under public/ moves every one of the 72 baselines.
      - 'public/**'
      - 'test/e2e/**'
      # A Next, Tailwind or PostCSS bump moves pixels without touching a single component.
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - 'pnpm-lock.yaml'
      - 'lighthouserc.json'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  # Superseded PR runs cancel: only the newest commit's pixels are interesting.
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PREFLIGHT: does the Vercel bypass secret exist?
  #
  # This job exists for one reason: a job that runs and takes no action reports `success`, which
  # is indistinguishable from a job that ran and passed. pr-compare used to do exactly that — the
  # gate step set ready=false, every later step was `if: ready == 'true'`, and the job ended green
  # having tested nothing. That is why it could never be promoted to a required check: on a fork or
  # a Dependabot PR (neither of which gets repo secrets) the green was vacuous.
  #
  # A job skipped by its own `if:` reports conclusion `skipped`, which IS distinguishable from
  # `success` in the API and the UI, and which branch protection treats as not-satisfied rather
  # than as a pass. `secrets` is not available in a job-level `if:`, so the check has to happen in
  # a job that CAN read it and be passed down as an output. Hence a preflight rather than a
  # one-line condition.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Is the Vercel bypass secret set?
        id: gate
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BYPASS}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual/a11y compare will be SKIPPED::VERCEL_AUTOMATION_BYPASS_SECRET is not set, so every preview route would serve Vercel's Deployment Protection interstitial instead of the app. The compare job is skipped rather than passed, so this cannot read as a green test run."
            {
              echo "### e2e compare skipped (not passed)"
              echo
              echo "\`VERCEL_AUTOMATION_BYPASS_SECRET\` is not configured for this repository."
              echo
              echo "Vercel Deployment Protection serves an auth interstitial to Playwright, so the"
              echo "suite would compare baselines against the wall rather than the app. The job is"
              echo "**skipped**, which is honest: a green here would claim a test run that did not"
              echo "happen, and a red X would claim a failure this PR did not cause."
              echo
              echo "**To enable:** Vercel → project → Settings → Deployment Protection →"
              echo "*Protection Bypass for Automation* → generate, then add the value as the GitHub"
              echo "Actions secret \`VERCEL_AUTOMATION_BYPASS_SECRET\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs only on pull_request, and only for the paths filter above. Three outcomes:
  #   · bypass secret missing        → the job is SKIPPED (see preflight above), never green
  #   · no successful Vercel preview → SKIP, green, with a notice (a PR can legitimately
  #                                    have no preview: forks, skipped builds, build failure
  #                                    which the Vercel check reports on its own)
  #   · preview resolved             → smoke + @a11y, then the @visual compare
  pr-compare:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Narrower than the workflow default (which is only `contents: write` for the
    # maintainer-triggered baseline commit). This job never writes.
    permissions:
      contents: read
      deployments: read
      statuses: read
    steps:
      # No gate step here any more. The `preflight` job above decides, and this job's `if:`
      # consumes it — so a missing secret SKIPS this job rather than running it to a vacuous green.
      - name: Resolve the PR's Vercel preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Vercel records each build as a GitHub Deployment on the head SHA and reports the
          # live URL as `environment_url` on the deployment's `success` status. Poll for it:
          # the PR event fires before the build finishes.
          url=""
          # 36 x 20s = 12 minutes, not 10. #2322 polled for 10 minutes, gave up, and reported
          # SUCCESS at 17:12:01 — nine seconds after its own Vercel Preview check went green at
          # 17:11:52. The build had not failed; the poll simply lost a race with it, and the
          # visual suite never ran behind a green check. Two minutes of headroom is the cheap
          # half of that fix; the classification below is the half that matters.
          for attempt in $(seq 1 36); do
            for dep in $(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=100" --jq '.[].id' || true); do
              candidate=$(gh api "repos/${REPO}/deployments/${dep}/statuses?per_page=100" \
                --jq 'map(select(.state=="success") | .environment_url // empty) | first // empty' || true)
              if [ -n "${candidate}" ]; then
                url="${candidate}"
                break
              fi
            done
            if [ -n "${url}" ]; then
              break
            fi
            echo "No successful deployment for ${SHA} yet (attempt ${attempt}/36); waiting 20s."
            sleep 20
          done

          if [ -z "${url}" ]; then
            # 🔴 A GREEN HERE IS ONLY HONEST WHEN THERE IS GENUINELY NOTHING TO TEST.
            #
            # The preflight job above already states this repo's rule: "a job that runs and takes
            # no action reports `success`, which is indistinguishable from a job that ran and
            # passed", and it fixed that for the missing-bypass-secret arm by SKIPPING the job.
            # This arm was left green on the strength of three enumerated cases — a fork, a
            # skipped build, or a build failure that Vercel's own check reports.
            #
            # #2322 was a FOURTH case nobody listed: the build SUCCEEDED and the deployment
            # simply arrived after the poll window. There was no build failure for Vercel to
            # report, so the justification did not hold, and pr-compare reported success having
            # photographed nothing. That is the vacuous green preflight exists to prevent,
            # reappearing one arm over.
            #
            # So classify the absence instead of assuming it is benign. A deployment still
            # PENDING is a build in flight: we ran out of patience, we did not run out of work,
            # and claiming success would be a lie. Anything else (no deployment at all, or a
            # failed one) keeps the quiet green the three enumerated cases justify.
            states=$(
              for dep in $(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=100" --jq '.[].id' || true); do
                gh api "repos/${REPO}/deployments/${dep}/statuses?per_page=100" --jq '.[].state' || true
              done
            )
            if printf '%s\n' "${states}" | grep -qE '^(pending|queued|in_progress)$'; then
              echo "::error title=Preview never resolved::A Vercel deployment for ${SHA} is still building after 12 minutes, so nothing was tested. This job fails rather than reporting a green it did not earn — re-run it once the preview is live."
              {
                echo "### e2e compare did NOT run"
                echo
                echo "A Vercel deployment for \`${SHA}\` was still building when the 12-minute poll"
                echo "expired, so the visual suite never ran."
                echo
                echo "**This is a failure and not a skip on purpose.** The build did not fail, so"
                echo "Vercel's own check will go green, and a green here too would be"
                echo "indistinguishable from \"the visual suite passed\" — which is exactly how"
                echo "#2322 merged with nothing photographed. Re-run this job once the preview is live."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual/a11y compare skipped::No Vercel deployment for ${SHA} is building or live after 12 minutes. Nothing was tested (the Vercel check reports build failures on its own)."
            {
              echo "### e2e compare skipped"
              echo
              echo "No successful Vercel deployment was found for \`${SHA}\` within 12 minutes, and"
              echo "none is still building — so there is nothing to wait for: a fork, a skipped"
              echo "build, or a build failure."
              echo "Build failures are reported by Vercel's own check; this job stays quiet rather"
              echo "than duplicating that signal as a false visual-regression failure."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
            echo "Resolved preview: ${url}"
            echo "### e2e compare target" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${url}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        if: steps.preview.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.preview.outputs.ready == 'true'
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        if: steps.preview.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        if: steps.preview.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.preview.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # ── The member session (ADR-950) ────────────────────────────────────────────────────
      #
      # WITHOUT THIS STEP THE GATE PHOTOGRAPHS THE MARKETING SITE AND NOTHING ELSE. Every
      # surface that HAS a rail, a dock or a fold control lives inside the `(main)` shell
      # behind auth; `appSurfaces()` covers four of them and they all skip when
      # PW_STORAGE_STATE is unset. Measured on #2048: `12 skipped · 64 passed`, green, over a
      # PR that changed the rail fill, the fold control and both dock heads.
      #
      # Sign-in is magic-link only, so there is no password to script. The session is MINTED
      # instead, exactly the way app/(main)/impersonate-actions.ts does in the product:
      # `generateLink` (which sends no email) then `verifyOtp`. Minted per run rather than
      # stored as a secret, because a stored one is wrong twice over — auth cookies are
      # domain-scoped and every PR gets a new preview hostname, and refresh tokens rotate on
      # first use. Both failures look exactly like "no credential", which is the silence this
      # whole gate is trying to stop producing.
      #
      # FAIL-SAFE: this step never fails the job. An absent secret is not this PR's fault,
      # and a red X meaning "the owner has not created a credential yet" trains people to
      # ignore the check (e2e.yml's founding argument). It says so loudly instead, here and
      # again in the reporter's PARTIAL banner, which names each unphotographed surface.
      - name: Mint the member session
        id: session
        if: steps.preview.outputs.ready == 'true'
        env:
          PW_BASE_URL: ${{ steps.preview.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PW_MEMBER_EMAIL: ${{ secrets.PW_MEMBER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # The script writes to PW_STORAGE_STATE when no --out is given, so the path is
          # declared once, here, and echoed as this step's output below.
          PW_STORAGE_STATE: ${{ github.workspace }}/test/e2e/.auth/member.json
        # NOT `set -e`: a mint failure must degrade to a loud PARTIAL, never a red gate.
        run: |
          set -uo pipefail
          missing=""
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && missing="${missing} SUPABASE_SERVICE_ROLE_KEY"
          [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && missing="${missing} NEXT_PUBLIC_SUPABASE_URL"
          [ -z "${PW_MEMBER_EMAIL:-}" ] && missing="${missing} PW_MEMBER_EMAIL"
          if [ -n "${missing}" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning title=No member session::Missing secret(s):${missing}. The app shell will not be photographed by this run; see the PARTIAL banner in the job summary."
            {
              echo "### ⚠️ No member session for this run"
              echo
              echo "Missing repository secret(s): \`${missing# }\`."
              echo
              echo "The four member-shell surfaces (\`/feed\`, the room, \`/settings\`, the Space"
              echo "console) are the only captured surfaces with a rail, a dock or a fold control,"
              echo "and they cannot be reached without a session. Everything below this line is the"
              echo "marketing site."
              echo
              echo "**To enable:** see \`test/e2e/README.md\` § The member shell. One account, three"
              echo "secrets, no credential file to rotate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if pnpm e2e:session; then
            echo "path=${PW_STORAGE_STATE}" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning title=Member session could not be minted::The secrets are configured and minting still failed (see this step's log). The app shell will not be photographed by this run."
            {
              echo "### 🔴 The member session is configured and did not work"
              echo
              echo "\`pnpm e2e:session\` failed even though every secret is present, so this run"
              echo "photographs the marketing site only. This is a credential problem, not a problem"
              echo "with this pull request — read the *Mint the member session* step's log."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Smoke + @a11y: no baseline dependency, so this half of the gate is trustworthy the
      # moment the bypass secret exists.
      #
      # PW_STORAGE_STATE is empty when the mint step above did not produce one; `surfaces.ts`
      # treats empty/missing as "no session" and the shell tests skip, loudly.
      - name: Smoke + a11y suite
        if: steps.preview.outputs.ready == 'true'
        env:
          PW_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          # Repo VARIABLES, not secrets: neither is sensitive, and both change the matrix.
          # PW_SPACE_SLUG is what adds /spaces/<slug>/manage at all.
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
          # Set PW_REQUIRE_SHELL=1 once the credential AND the shell baselines exist: from
          # then on, a run that photographs zero app surfaces fails instead of announcing.
          # Read from EITHER tab. It belongs in Variables (nothing here is sensitive), but a
          # ratchet that silently stays off because it was typed into the Secrets tab is the
          # exact failure this flag exists to prevent -- so accept both rather than trust aim.
          PW_REQUIRE_SHELL: ${{ vars.PW_REQUIRE_SHELL || secrets.PW_REQUIRE_SHELL }}
        run: pnpm test:e2e

      # @visual: needs committed baselines captured against a deployment of the SAME kind.
      # always() so a smoke/a11y failure above does not hide a pixel regression here.
      - name: Visual compare
        if: ${{ always() && steps.preview.outputs.ready == 'true' }}
        env:
          PW_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_STORAGE_STATE: ${{ steps.session.outputs.path }}
          PW_ROOM_PATH: ${{ vars.PW_ROOM_PATH }}
          PW_SPACE_SLUG: ${{ vars.PW_SPACE_SLUG }}
          PW_REQUIRE_SHELL: ${{ vars.PW_REQUIRE_SHELL || secrets.PW_REQUIRE_SHELL }}
        run: pnpm test:e2e:visual

      # The synthetic speed gate used to run here as steps 11-13. It is its own parallel
      # job now (ADR-936) -- see `lighthouse:` below.

      - name: Upload report + diffs
        if: ${{ failure() && steps.preview.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr-compare
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── The speed gate, in its OWN job so it stops serialising behind Playwright ──────────
  #
  # It used to be steps 11-13 of pr-compare. That put ~13 minutes of Lighthouse (4 URLs x 3
  # runs = 12 full audits) AFTER ~11 minutes of Playwright, for a ~25-minute wall clock on
  # every PR that touches app/ or components/. The two have no dependency on each other:
  # both need only the resolved preview URL. Run side by side and the slower one sets the
  # clock, so the same work lands in ~15 minutes.
  #
  # It resolves the preview ITSELF rather than taking it from pr-compare as a job output.
  # That duplicates ~1-2 minutes of polling, and buys total isolation: pr-compare keeps the
  # exact shape it had, so the visual/a11y gate cannot be broken by a change made purely to
  # speed up the speed gate. Given that this workflow's failure mode is a SILENT SKIP -- a
  # green tick with nothing behind it, which is the thing e2e.yml's own header warns about
  # -- that trade is worth two minutes.
  #
  # Same skip-green semantics as pr-compare: no bypass secret or no successful deployment
  # means nothing was tested, said out loud in a notice, never a red X.
  lighthouse:
    # Same reasoning as pr-compare: skipped rather than vacuously green when the secret is absent.
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      statuses: read
    steps:
      # No gate step: `preflight` decides and this job's `if:` consumes it.
      - name: Resolve the PR's Vercel preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Vercel records each build as a GitHub Deployment on the head SHA and reports the
          # live URL as `environment_url` on the deployment's `success` status. Poll for it:
          # the PR event fires before the build finishes.
          url=""
          # 36 x 20s = 12 minutes, not 10. #2322 polled for 10 minutes, gave up, and reported
          # SUCCESS at 17:12:01 — nine seconds after its own Vercel Preview check went green at
          # 17:11:52. The build had not failed; the poll simply lost a race with it, and the
          # visual suite never ran behind a green check. Two minutes of headroom is the cheap
          # half of that fix; the classification below is the half that matters.
          for attempt in $(seq 1 36); do
            for dep in $(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=100" --jq '.[].id' || true); do
              candidate=$(gh api "repos/${REPO}/deployments/${dep}/statuses?per_page=100" \
                --jq 'map(select(.state=="success") | .environment_url // empty) | first // empty' || true)
              if [ -n "${candidate}" ]; then
                url="${candidate}"
                break
              fi
            done
            if [ -n "${url}" ]; then
              break
            fi
            echo "No successful deployment for ${SHA} yet (attempt ${attempt}/36); waiting 20s."
            sleep 20
          done

          if [ -z "${url}" ]; then
            # 🔴 A GREEN HERE IS ONLY HONEST WHEN THERE IS GENUINELY NOTHING TO TEST.
            #
            # The preflight job above already states this repo's rule: "a job that runs and takes
            # no action reports `success`, which is indistinguishable from a job that ran and
            # passed", and it fixed that for the missing-bypass-secret arm by SKIPPING the job.
            # This arm was left green on the strength of three enumerated cases — a fork, a
            # skipped build, or a build failure that Vercel's own check reports.
            #
            # #2322 was a FOURTH case nobody listed: the build SUCCEEDED and the deployment
            # simply arrived after the poll window. There was no build failure for Vercel to
            # report, so the justification did not hold, and pr-compare reported success having
            # photographed nothing. That is the vacuous green preflight exists to prevent,
            # reappearing one arm over.
            #
            # So classify the absence instead of assuming it is benign. A deployment still
            # PENDING is a build in flight: we ran out of patience, we did not run out of work,
            # and claiming success would be a lie. Anything else (no deployment at all, or a
            # failed one) keeps the quiet green the three enumerated cases justify.
            states=$(
              for dep in $(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=100" --jq '.[].id' || true); do
                gh api "repos/${REPO}/deployments/${dep}/statuses?per_page=100" --jq '.[].state' || true
              done
            )
            if printf '%s\n' "${states}" | grep -qE '^(pending|queued|in_progress)$'; then
              echo "::error title=Preview never resolved::A Vercel deployment for ${SHA} is still building after 12 minutes, so nothing was tested. This job fails rather than reporting a green it did not earn — re-run it once the preview is live."
              {
                echo "### e2e compare did NOT run"
                echo
                echo "A Vercel deployment for \`${SHA}\` was still building when the 12-minute poll"
                echo "expired, so the visual suite never ran."
                echo
                echo "**This is a failure and not a skip on purpose.** The build did not fail, so"
                echo "Vercel's own check will go green, and a green here too would be"
                echo "indistinguishable from \"the visual suite passed\" — which is exactly how"
                echo "#2322 merged with nothing photographed. Re-run this job once the preview is live."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual/a11y compare skipped::No Vercel deployment for ${SHA} is building or live after 12 minutes. Nothing was tested (the Vercel check reports build failures on its own)."
            {
              echo "### e2e compare skipped"
              echo
              echo "No successful Vercel deployment was found for \`${SHA}\` within 12 minutes, and"
              echo "none is still building — so there is nothing to wait for: a fork, a skipped"
              echo "build, or a build failure."
              echo "Build failures are reported by Vercel's own check; this job stays quiet rather"
              echo "than duplicating that signal as a false visual-regression failure."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "url=${url}" >> "$GITHUB_OUTPUT"
            echo "Resolved preview: ${url}"
            echo "### e2e compare target" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${url}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        if: steps.preview.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.preview.outputs.ready == 'true'
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        if: steps.preview.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        if: steps.preview.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.preview.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Lighthouse (synthetic speed)
        if: ${{ always() && steps.preview.outputs.ready == 'true' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # Deployment Protection would otherwise serve Lighthouse the auth interstitial and
          # we would be grading the login wall. Same bypass the Playwright steps use,
          # passed below as an extra request header.
          urls=""
          for path in "/" "/pricing" "/the-community" "/loneliness"; do
            urls="${urls} --collect.url=${PREVIEW_URL}${path}"
          done
          npx --yes @lhci/cli@0.15.1 autorun \
            --config=./lighthouserc.json \
            ${urls} \
            --collect.settings.extraHeaders="{\"x-vercel-protection-bypass\":\"${BYPASS}\"}" \
          || { echo "::warning title=Lighthouse::assertions failed -- see the job log and the uploaded .lighthouseci report"; exit 1; }

      # Print the medians into the job summary. WHY THIS EXISTS: lighthouse-ci only prints
      # assertions that FAIL, so a fully passing run says nothing about how close it came --
      # and ADR-930 says these thresholds are guesses to be re-set from real data. The first
      # green run proved the point: LCP/CLS/TBT all passed and the log carried not one number.
      # The artifact holds them, but it is a 26MB zip on blob storage that an agent sandbox
      # cannot reach, so "download the artifact" is not a route anyone can rely on. Putting the
      # numbers in the summary makes every run self-reporting: the evidence lands where the
      # result is read. Never fails the job -- it reports, the assertions gate.
      - name: Report the numbers
        if: ${{ always() && steps.preview.outputs.ready == 'true' }}
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            if (!fs.existsSync(dir)) { console.log("no .lighthouseci dir"); process.exit(0); }
            // 🔴 THE BUDGETS ARE READ FROM lighthouserc.json, NEVER RESTATED HERE (ADR-1030).
            // They were hardcoded, and they were the ADR-930 GUESSES that ADR-936 had already
            // replaced: LCP 4000 vs the asserted 2500, TBT 600 vs 300, FCP 2500 vs 1000, weight
            // 3.5MB vs 2MB. Four of five columns reported a looser budget than the one actually
            // gating, all in the same direction -- so the headroom column read HEALTHIER than the
            // truth, and a PR could show comfortable headroom in the summary while the assertion
            // failed three lines below it. The whole point of this step is that the evidence lands
            // where the result is read; evidence measured against the wrong number is worse than
            // none. One source of truth, so a future re-tune cannot drift them apart again.
            const rc = JSON.parse(fs.readFileSync("lighthouserc.json", "utf8"));
            const assertions = rc.ci?.assert?.assertions ?? {};
            // Each entry is [level, {maxNumericValue}] -- or a bare "warn" for score audits,
            // which carry no numeric budget and are dropped by the filter below.
            const ruleOf = (id) => {
              const a = assertions[id];
              return Array.isArray(a) ? { level: a[0], budget: a[1]?.maxNumericValue } : {};
            };
            const METRICS = [
              ["largest-contentful-paint", "LCP", "ms"],
              ["cumulative-layout-shift",  "CLS", ""],
              ["total-blocking-time",      "TBT", "ms"],
              ["first-contentful-paint",   "FCP", "ms"],
              ["total-byte-weight",        "Weight", "b"],
            ].map(([id, label, unit]) => [id, label, unit, ruleOf(id)])
             .filter(([, , , rule]) => typeof rule.budget === "number");
            const byUrl = new Map();
            for (const f of fs.readdirSync(dir).filter((f) => f.startsWith("lhr-") && f.endsWith(".json"))) {
              let lhr; try { lhr = JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")); } catch { continue; }
              const url = lhr.finalDisplayedUrl || lhr.requestedUrl || "?";
              if (!byUrl.has(url)) byUrl.set(url, []);
              byUrl.get(url).push(lhr);
            }
            const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
            // The `on breach` column exists because "over budget" means two different things here and
            // the reader cannot otherwise tell which: an LCP/CLS/TBT breach FAILS the job, while
            // FCP and Weight are warns that inform and never block (lighthouserc.json explains
            // why for each). A table that presented all five identically invited both mistakes --
            // panicking over a warn, and shrugging at the one that just went red.
            const out = ["| URL | metric | median | budget | headroom | on breach |", "|---|---|---|---|---|---|"];
            for (const [url, runs] of byUrl) {
              const path = (() => { try { return new URL(url).pathname; } catch { return url; } })();
              for (const [id, label, unit, rule] of METRICS) {
                const vals = runs.map((r) => r.audits?.[id]?.numericValue).filter((v) => typeof v === "number");
                if (!vals.length) continue;
                const m = median(vals);
                const pct = Math.round((1 - m / rule.budget) * 100);
                const fmt = (v) => (unit === "b" ? `${(v / 1e6).toFixed(2)}MB` : unit === "ms" ? `${Math.round(v)}ms` : v.toFixed(3));
                const gate = rule.level === "error" ? "fails" : "warns";
                out.push(`| ${path} | ${label} | ${fmt(m)} | ${fmt(rule.budget)} | ${pct}% | ${gate} |`);
              }
            }
            const table = out.join("\n");
            console.log(table);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Lighthouse medians\n\n${table}\n`);
            }
          '

      # The first run of this step uploaded NOTHING and still went green. LHCI writes to
      # `.lighthouseci/`, which is a HIDDEN directory, and upload-artifact@v4 defaults
      # `include-hidden-files: false` -- so it found no files, and `if-no-files-found: ignore`
      # swallowed that. The log said "Dumping 12 reports to disk" three lines above "No files
      # were found with the provided path". A gate whose evidence never leaves the runner is
      # the same green-tick-with-nothing-behind-it this wave spent its time closing.
      # `error` rather than `ignore`: if the reports vanish again, that must be loud, because
      # the numbers in them are the only way to re-set the thresholds ADR-930 admits are guesses.
      - name: Upload Lighthouse report
        if: ${{ always() && steps.preview.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-pr-compare
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
