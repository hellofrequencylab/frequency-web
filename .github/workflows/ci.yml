# Code-quality gate (BUILD-LIST P8): typecheck + lint + tests + the contract guards on every
# PR to main. The Vercel deploy build is the only other check and it does NOT run the test
# suite — this does. No app secrets needed: tsc, eslint, and vitest don't touch the Supabase /
# Stripe env (only `next build` does, which Vercel owns).
#
# ── Shape, and why (2026-08-10, ADR-962) ──────────────────────────────────────────────────
# This was ONE job of 23 sequential steps with no `if:`, which had two costs the owner felt as
# "CI fails every time, twenty minutes in":
#
#   · FAIL-FAST HID THE REST. A red Typecheck skipped Lint, Test and all 20 guards. Four guard
#     violations meant four pushes and four full runs to discover, one at a time. The 20 guards
#     together take FOURTEEN SECONDS — measured, on this tree — so there was never a cost reason
#     to stop at the first one.
#   · THE GUARDS RAN LAST. Install + typecheck + lint (~2.5 min) + test (~1.5 min) fill the
#     first stretch, so whichever guard trips, it trips near the end. That is why every failure
#     looked like the same failure.
#
# MEASURED AFTER THE SPLIT: the `checks` job (checkout + install + typecheck + all 20 guards)
# completes in **55 seconds**, with the aggregated guard step taking 13 of them.
#
# ⚠️ One number in the original diagnosis did NOT hold up, and it is recorded here so nobody
# re-derives the wrong conclusion. `actions/checkout` took 3m11s on the first run measured, which
# looked like the 184 MB working tree (100 MB of it PNG baselines). On the three-job run it took
# **7 to 9 seconds in all three jobs concurrently**. 184 MB in 9 s is a normal warm fetch, so the
# 191 s was a cold or contended runner, not the tree. Git LFS on the baselines is still worth
# doing for repo GROWTH -- .git is 348 MB across ~51 commits because every baseline refresh
# re-commits all 72 PNGs and they do not delta-compress -- but it is NOT what made CI slow, and
# the three-way split does not depend on it.
#
# So: three parallel jobs split along the COST axis, and the guards aggregated into one step
# that runs them all and reports every failure at once. Not a per-guard matrix — that would pay
# ~25 s checkout+install prelude 20 times over to parallelise 14 seconds of work.
#
# `!cancelled()` rather than `always()`: `always()` is true even for a CANCELLED run, which
# would make superseded runs finish their whole body and defeat `cancel-in-progress`.
#
# ✅ THE SPLIT IS SAFE — the owner action this block used to demand was taken on 2026-08-10.
# `main` is protected by a REPOSITORY RULESET (id 17640795, named "main") — not by classic
# branch protection, which is why a "Settings → Branches" path leads nowhere. Re-verified
# against the API on 2026-08-10, AFTER the fix, the ruleset's `required_status_checks` rule
# now lists FOUR contexts:
#
#     checks · analyze · lint · test
#
# Splitting this workflow meant `checks` no longer contains lint or the test suite, and a job
# that is not a required context cannot block a merge — so for a window, a PR with failing
# tests was mergeable. That window is closed. The job names below are exactly `lint` and
# `test` because that is how they are named in the ruleset; renaming one silently un-gates it.
#
# ⚠️ CORRECTED 2026-08-12 — this block said `pr-compare` was "STILL NOT REQUIRED, deliberately"
# and that was FALSE. Ruleset 17640795 requires `checks`, `analyze`, `lint`, `test` AND
# `pr-compare`; it was last modified 2026-08-11 03:55Z and nobody updated this comment. The
# config drifted from the doc and no gate noticed, which is the same class of failure as every
# other one recorded today. `lighthouse` is genuinely still advisory.
#
# 🔴 A REQUIRED `pr-compare` DEADLOCKS ANY PR THAT CANNOT TRIGGER e2e.yml. It is posted by a
# path-filtered workflow, so a docs-only, migrations-only or scripts-only PR never produces the
# context, and GitHub blocks such a PR FOREVER on "Expected — Waiting for status to be reported".
# `bypass_actors` is null, so an admin cannot force it either. PR #2107 (two files, both docs/)
# hit exactly this. `.github/workflows/pr-compare-fallback.yml` now posts the context for those
# PRs, reading e2e.yml's own path list so the two can never drift apart.
#
# A Claude Code session cannot change this: the agent proxy refuses writes to the GitHub
# rulesets API. Reading it back is permitted, which is how the state above was confirmed —
# so verify, do not assume, before citing this block.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Newer pushes to the same ref supersede in-flight runs — but ONLY for pull requests. Keyed on
# `github.ref` alone, a push to main collapses to `ci-refs/heads/main`, so merging two PRs in
# quick succession cancelled the first merge commit's run and destroyed the post-merge signal
# on that SHA permanently. A merge-commit run has no successor to supersede it; let it finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    # Measured ~2.5 min. The ceiling is for a hung process, not a slow one: with no
    # `timeout-minutes` at all, GitHub's default is SIX HOURS, and this repo has already
    # burned a 93-minute run on a job nobody was watching.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # ESLint's own cache, keyed on CONTENT rather than the default metadata strategy: a
      # fresh checkout resets every mtime, so a metadata-keyed cache never hits in CI.
      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test

  # Typecheck plus every contract guard: about a minute of real work in total.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # tsconfig sets `incremental: true`, so CI was paying to WRITE .tsbuildinfo every run
      # and never reading one back.
      - name: Restore tsbuildinfo
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # One step, every guard, all failures reported. Each is grouped in the log so a red run
      # reads as a list of what to fix rather than a single stop-the-world exit.
      #
      # NOTE: check:cron-freshness is intentionally absent, and as of 2026-08-11 it now runs
      # WEEKLY in .github/workflows/maintenance.yml (the "Cron heartbeat coverage" step), which
      # is the destination this comment previously claimed while it was true of nothing.
      #
      # Why there and not here. Half of what it measures is deployment state: whether
      # CRON_HEARTBEAT_BASE_URL is set in Vercel Production. CI is not that environment, so on a
      # PR that half can only ever report NOT ESTABLISHED, for every author, every time, and a
      # red build on it would fail for something no pull request can fix. Same reasoning as
      # ADR-970 and check:research-freshness: an advisory finding forced through a blocking gate
      # teaches everyone to route around the gate.
      #
      # The other half IS deterministic (every cron has a handler, wrapped in withCronHeartbeat
      # under its own name, with a schedule that parses), and the scheduled step is strict about
      # exactly that half, opening the weekly tracking issue when it breaks. Do NOT add
      # `cron-freshness` to the guards array below: with no deployment env its coverage verdict
      # would be noise, and the wiring half is already gated where the finding has an owner.
      - name: Contract guards (all run; every failure reported)
        if: ${{ !cancelled() }}
        # ARMS THE LEDGER HALF OF check:migrations. Without these two, that guard proves only that
        # the TREE is well-formed and says so in a loud skip; it cannot tell you whether production
        # has applied exactly these migrations and nothing else.
        #
        # 🔴 WHY IT IS ARMED HERE. On 2026-08-12 production ran a security migration
        # (20270224000100_revoke_friendships_freeze_identity_execute) whose file existed in NO
        # branch — it was applied via execute_sql, then lost when a branch was rebuilt with
        # cherry-picks after a bad rebase. For a full day the repo could not reproduce its own
        # database, and every gate was green: the old check was a hand-pinned COUNT in
        # ledger-parity.test.ts, re-frozen five times, and the count was 606 on both sides because
        # one file was missing AND one was unapplied. A count is not a set.
        #
        # On a fork PR these are empty and the guard degrades to the same loud skip rather than a
        # false pass — the skip states what was proved and what was not. That is deliberate: the
        # failure mode of a credential-less run must never be a silent green.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          failed=()
          # Keep this list and the summary count in sync WITHOUT hand-counting: the total is
          # derived below from the array itself. It used to be hardcoded, and read "All 21"
          # while 24 guards ran — a drift that a guard suite of all things should not carry.
          # ⚠️ A guard that is not in this array does not run. #2098 shipped check:studio and
          # check:creates as package.json scripts and never added them here, so the Studio
          # contract — the thing AGENTS.md calls "machine-enforced" — was enforced by nothing for
          # the whole life of that PR. Adding a check:* script is two edits, not one.
          #
          # This array is for SOURCE-only guards. The two ARTIFACT gates (check:build-budget,
          # check:og-trace) deliberately live in `postbuild` instead, because CI never builds —
          # Vercel does. See docs/DEPLOY-SAFETY.md and ADR-1003.
          guards=(
            authz canon menu gate-parity workflows elements labels render-path help tokens phantom bridge contrast adoption
            headers seo collective crm-parity vocab rls grants admin-client migrations adr docs-links templates
            studio creates
          )
          # RUN IN PARALLEL, REPORT IN ORDER. The guards are independent node processes that only
          # read the tree, so nothing about them needed to be sequential — it just was. Run wall
          # clock was the SUM of 26 guards plus 26 pnpm startups; it is now bounded by the
          # slowest single guard (check:tokens, ~2.5s locally).
          #
          # Output still reads exactly as before. Each guard's stdout+stderr goes to its own file
          # and the groups are printed afterwards in the DECLARED order, so a parallel run never
          # interleaves two guards' output or shuffles them run to run. Losing that is the usual
          # price of parallelising a loop like this, and it is the whole reason the loop is
          # readable when something breaks.
          #
          # Concurrency is capped: the runner has 2 cores, and 26 concurrent node processes trade
          # a fast pass for an OOM on the one run that matters.
          out=$(mktemp -d)
          maxp=6
          for guard in "${guards[@]}"
          do
            (
              if pnpm "check:${guard}" >"${out}/${guard}.log" 2>&1
              then echo ok > "${out}/${guard}.status"
              else echo fail > "${out}/${guard}.status"
              fi
            ) &
            while [ "$(jobs -rp | wc -l)" -ge "${maxp}" ]; do wait -n; done
          done
          wait

          for guard in "${guards[@]}"
          do
            echo "::group::check:${guard}"
            cat "${out}/${guard}.log" || true
            echo "::endgroup::"
            # A missing status file means the subshell died without writing one — treat that as a
            # failure rather than a pass, so a killed worker cannot read as a green guard.
            if [ "$(cat "${out}/${guard}.status" 2>/dev/null)" != "ok" ]; then
              echo "::error title=check:${guard}::failed — see the check:${guard} group above"
              failed+=("${guard}")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            {
              echo "### ✗ ${#failed[@]} contract guard(s) failed"
              echo
              for g in "${failed[@]}"; do echo "- \`pnpm check:${g}\`"; done
              echo
              echo "Run them locally with the commands above — each prints what to fix."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✓ All ${#guards[@]} contract guards passed" >> "$GITHUB_STEP_SUMMARY"
