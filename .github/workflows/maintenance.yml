# Scheduled maintenance sweep (docs/MAINTENANCE-AUTOMATION.md Phase 3). The Tier-2 loop:
# weekly, surface only what's NEW (time-based signals that per-PR CI can't catch), and open a
# single tracking issue when there's something to act on — silent otherwise.
#
# What runs with NO secrets (always):
#   - pnpm audit (dependency vulnerabilities are disclosed over time, not tied to a PR)
#   - cron heartbeat coverage: every job in vercel.json has a handler, that handler is wrapped in
#     withCronHeartbeat under its own name, and every schedule parses to a real fresh-by window.
#     Strict about those (they are facts about the tree), advisory about whether a monitor URL is
#     configured (that lives in Vercel Production, which this runner is not).
# What runs WHEN the owner adds SUPABASE_ACCESS_TOKEN (arms the DB-credentialed checks):
#   - fetch Supabase security + performance advisors, diff against the accepted-risk allowlist
#     (scripts/maintenance/accepted-advisories.json), report only new findings.
#   - migration ledger parity: supabase/migrations/*.sql filenames vs the applied ledger, on BOTH
#     the version and the name. This is the home for DB-credentialed checks precisely because CI
#     has none, so the ci.yml guard array cannot host them.
#
# On any new WARN/ERROR it creates-or-updates one issue titled "🔧 Weekly maintenance sweep";
# a clean run adds nothing (quiet-by-default). Phase 4 layers an AI triage step on top.
name: maintenance
on:
  schedule:
    - cron: '17 7 * * 1' # Mondays 07:17 UTC (off the :00 stampede)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Dependency vulnerabilities (no secret needed) ──────────────────────────
      - name: pnpm audit
        id: audit
        run: |
          set +e
          OUT=$(pnpm audit --prod --audit-level=moderate 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "## Dependency audit"
            if [ $CODE -eq 0 ]; then echo "✓ pnpm audit clean (moderate+)."
            else echo "⚠️ pnpm audit found advisories:"; echo '```'; echo "$OUT" | tail -40; echo '```'; fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$OUT" > audit.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # ── Supabase advisor drift (stateful diff) — only when the token is present ──
      - name: Supabase advisor diff
        id: advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Supabase advisor diff skipped — set the SUPABASE_ACCESS_TOKEN secret + SUPABASE_PROJECT_REF var to arm it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors"
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$BASE/security" > sec.json
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$BASE/performance" > perf.json
          REPORT=$(node scripts/maintenance/advisor-diff.mjs sec.json perf.json)
          CODE=$?
          echo "$REPORT"
          { echo "## Supabase advisors (new only)"; echo "$REPORT"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT" > advisors.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # ── Migration ledger parity (repo filenames ⇄ supabase_migrations.schema_migrations) ──
      #
      # Same credential path as the advisor diff above, deliberately: the fetch is a token-gated
      # step here and scripts/maintenance/ledger-parity.mjs consumes its JSON, so the script itself
      # never touches the database and stays testable without one.
      #
      # This does NOT belong in the ci.yml guard array. CI has no database credentials, and a
      # parity check with no ledger to read can only pass vacuously. Read-only: the query is a
      # plain SELECT and the repair it recommends is for a human to run knowingly.
      - name: Migration ledger parity
        id: ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Migration ledger parity skipped — set the SUPABASE_ACCESS_TOKEN secret + SUPABASE_PROJECT_REF var to arm it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          QUERY=$(node scripts/maintenance/ledger-parity.mjs --print-query)
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg q "$QUERY" '{query: $q}')" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" > ledger.json
          REPORT=$(node scripts/maintenance/ledger-parity.mjs ledger.json 2>&1)
          CODE=$?
          echo "$REPORT"
          { echo "## Migration ledger parity"; echo "$REPORT"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT" > ledger.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # ── Cron heartbeat coverage (docs/MAINTENANCE-AUTOMATION.md item 7) ──────────────────────
      #
      # WHY HERE. This is the one guard the repo defines that ran in no workflow at all, so 27 cron
      # jobs were watched by a human remembering to type `pnpm check:cron-freshness`. It belongs in
      # the sweep and not in the ci.yml guard array for two reasons: it measures live operational
      # state, so a red build on it would fail for something no pull request can fix (ADR-970), and
      # its monitor half depends on deployment env
      # CI does not have, so on a PR it could only ever report NOT ESTABLISHED, for every author,
      # every time. That is how a gate becomes something to route around.
      #
      # NOT SKIPPED WHEN THE SECRET IS ABSENT, and that is deliberate. The other two steps here have
      # nothing to compute without their token; this one has plenty: it proves from the tree alone
      # that every cron has a route handler, that the handler composes withCronHeartbeat under the
      # same job name, and that every schedule parses to a real fresh-by window. Those are strict.
      # It is only the coverage VERDICT that needs env, and that half degrades to the same ℹ️ line
      # and exit 0 the credentialed steps use.
      #
      # CRON_HEARTBEAT_BASE_URL is optional and presence-only: the value is never read or printed.
      # Set it as a repo secret to mirror what Vercel Production holds; without it the report says
      # coverage is not established rather than guessing in either direction.
      - name: Cron heartbeat coverage
        id: cron
        env:
          CRON_HEARTBEAT_BASE_URL: ${{ secrets.CRON_HEARTBEAT_BASE_URL }}
        run: |
          set +e
          REPORT=$(node scripts/cron-freshness.mjs --markdown 2>&1)
          CODE=$?
          echo "$REPORT"
          { echo "## Cron heartbeat coverage"; echo "$REPORT"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT" > cron.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # ── Community Collective phase gate (ADR-811) ────────────────────────────────────────────
      #
      # WHY HERE AND NOT IN ci.yml's GUARD ARRAY (moved 2026-08-12). Everything else in that array
      # asserts a property of the CODE. This one grades a BUILD PLAN — it reads
      # docs/COMMUNITY-COLLECTIVE-BUILD-PLAN.md's phases against the tree and reports ⏳ for phases
      # nobody has started, ⚠ for tracked follow-ups, ✗ only for a half-wired tier. Off-plan
      # document state is not a merge blocker: a PR that touches none of it can neither cause nor
      # fix a finding here, which is the same reason cron-freshness sits in this workflow (ADR-970).
      #
      # It is ALSO the reason it stayed a standalone script when six of its neighbours became vitest
      # tests: its output is a per-phase REPORT a human reads, not an assertion. A vitest test can
      # say "this is broken"; it cannot say "phase 3 has not started, and that is fine".
      #
      # It exits non-zero only on a genuine inconsistency, so its code feeds the tracking issue.
      - name: Community Collective phase gate
        id: collective
        run: |
          set +e
          REPORT=$(pnpm check:collective 2>&1)
          CODE=$?
          echo "$REPORT"
          { echo "## Community Collective phase gate"; echo '```'; echo "$REPORT"; echo '```'; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          # Only surface it in the tracking issue when it actually found an inconsistency — a clean
          # phase report is not news, and an issue nobody needs to read is an issue nobody reads.
          if [ "$CODE" != "0" ]; then printf '```\n%s\n```\n' "$REPORT" > collective.txt; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # ── AI triage (Phase 4) — optional, uses the existing ANTHROPIC_API_KEY. Advises only;
      #    never edits code. Non-fatal, so the deterministic report always ships.
      #
      #    ⚠️ sweep.mts reads audit.txt + advisors.txt only, so ledger drift and cron wiring are NOT
      #    triaged by the model. They go straight into the issue body below. That is acceptable
      #    because both reports already state the exact repair, and it is the reason this step's
      #    `if` does not gate on steps.ledger or steps.cron. ────────────────────────────────────
      - name: AI triage
        if: steps.audit.outputs.code != '0' || steps.advisors.outputs.code == '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/maintenance/sweep.mts

      # ── Open / update one tracking issue only when there's something to act on ──
      #    `steps.cron.outputs.code != '0'` rather than `== '1'`: that step's script exits 1 for a
      #    broken wiring contract and 0 for the advisory coverage verdict, so any OTHER code means
      #    node itself died and a dead instrument is exactly what this sweep must not swallow.
      - name: Report to a tracking issue on delta
        if: steps.audit.outputs.code != '0' || steps.advisors.outputs.code == '1' || steps.ledger.outputs.code == '1' || steps.cron.outputs.code != '0' || steps.collective.outputs.code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const read = (f) => { try { return fs.readFileSync(f, 'utf8') } catch { return '' } }
            const body = [
              `Automated weekly maintenance sweep (${new Date().toISOString().slice(0,10)}). New items only — see docs/MAINTENANCE-AUTOMATION.md.`,
              '',
              read('triage.md') && ('### Triage\n' + read('triage.md')),
              read('audit.txt') && ('### Dependency audit\n```\n' + read('audit.txt').split('\n').slice(-40).join('\n') + '\n```'),
              read('advisors.txt') && ('### Supabase advisors (new)\n' + read('advisors.txt')),
              read('ledger.txt') && ('### Migration ledger parity\n' + read('ledger.txt')),
              read('cron.txt') && ('### Cron heartbeat coverage\n' + read('cron.txt')),
              read('collective.txt') && ('### Community Collective phase gate\n' + read('collective.txt')),
            ].filter(Boolean).join('\n')
            const title = '🔧 Weekly maintenance sweep'
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            })
            const existing = open.find((i) => i.title === title && !i.pull_request)
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body })
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: 'Re-ran — findings above refreshed.' })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
            }
