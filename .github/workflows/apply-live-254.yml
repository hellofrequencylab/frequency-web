# ONE-SHOT. Dispatch once to apply LIVE-254's menu_items migration to production
# (check:migrations is red until the ledger row exists). Delete this file in the
# same PR after the apply succeeds so it never lands on main.
name: apply-live-254
on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply 20270345006000 and stamp the ledger at the file version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && vars.SUPABASE_PROJECT_REF || '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF"
            exit 1
          fi
          FILE=supabase/migrations/20270345006000_public_header_quest_under_community.sql
          test -f "$FILE"
          post() {
            local json="$1"
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$json" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          }
          echo "::group::DDL"
          DDL_JSON=$(jq -n --rawfile q "$FILE" '{query: $q}')
          DDL_OUT=$(post "$DDL_JSON")
          echo "$DDL_OUT"
          echo "::endgroup::"
          echo "$DDL_OUT" | jq -e 'type == "array" or . == [] or has("message") | not' >/dev/null 2>&1 || true
          if echo "$DDL_OUT" | jq -e '.message? or .error? or .code?' >/dev/null 2>&1; then
            echo "DDL failed"
            exit 1
          fi
          echo "::group::ledger"
          LEDGER_JSON=$(jq -n '{query: "insert into supabase_migrations.schema_migrations (version, name) values ('\''20270345006000'\'', '\''public_header_quest_under_community'\'') on conflict (version) do nothing returning version, name;"}')
          LEDGER_OUT=$(post "$LEDGER_JSON")
          echo "$LEDGER_OUT"
          echo "::endgroup::"
          if echo "$LEDGER_OUT" | jq -e '.message? or .error? or .code?' >/dev/null 2>&1; then
            echo "ledger insert failed"
            exit 1
          fi
          echo "::group::verify"
          VERIFY_JSON=$(jq -n '{query: "select version, name from supabase_migrations.schema_migrations where version = '\''20270345006000'\'';"}')
          VERIFY_OUT=$(post "$VERIFY_JSON")
          echo "$VERIFY_OUT"
          echo "::endgroup::"
          echo "$VERIFY_OUT" | jq -e '.[] | select(.version=="20270345006000")' >/dev/null
