name: Sentinel sweep

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated findings through the Sentinel GitHub App
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentinel-main
  cancel-in-progress: false

jobs:
  review:
    if: vars.SENTINEL_SWEEPS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review the bounded source diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SENTINEL_ANTHROPIC_API_KEY }}
        run: node scripts/sentinel-sweep.mjs sweep "$RUNNER_TEMP/sentinel.json"
      - name: Upload the audit report
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-report
          path: ${{ runner.temp }}/sentinel.json
      - name: Create repository-scoped issue token
        if: github.event_name == 'schedule' || inputs.publish
        uses: actions/create-github-app-token@v3
        id: sentinel-token
        with:
          client-id: ${{ vars.SENTINEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SENTINEL_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Publish validated findings
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ steps.sentinel-token.outputs.token }}
        run: node scripts/sentinel-sweep.mjs publish "$RUNNER_TEMP/sentinel.json"
