<script type="text/babel" src="icon.jsx"></script>
<script type="text/babel" src="header.jsx"></script>
<script type="text/babel" src="footer.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" data-presets="react">
const NSQ = window.DAWNFrequencyDesignSystem_c868e3;
const IcNSQ = ({ n, s = 20 }) => <window.MkIco n={n} style={{ width: s, height: s }} />;

const RANKS = [['Ghost', 'ghost', 'You signed up'], ['Initiate', 'initiate', 'One Journey done'], ['Adept', 'adept', 'Two Journeys'], ['Vanguard', 'vanguard', 'You bring people'], ['Sovereign', 'sovereign', 'You run the place']];
const LAWS = [
  ['In person pays five times', 'zap', 'Twenty five Zaps for turning up. Five for posting about it. The ratio is the whole argument.'],
  ['A missed day is a hollow dot', 'circle-dashed', 'No red, no guilt screen, no notification designed to make you feel behind. Two freezes a month, because life happens.'],
  ['Nothing is behind a wall', 'unlock', 'Every feature is on the free plan, capped. You pay for volume and for cashing out, never for access.'],
];

function Page() {
  const { Button, Card, RankBadge } = NSQ;
  return (
    <>
      <window.PageHero
        image="../../assets/images/beach-sunset-dance.jpg"
        alt="A crowd dancing on the sand at sunset"
        eyebrow="The Quest"
        title="A game that pays you"
        script="for leaving the house"
        lead="Every reward points one direction: at a real room, with real people, on a Thursday. Screen time earns almost nothing, on purpose."
        primary="Join the beta"
        secondary="How ranks work"
        facts={[['4', 'Ranks a season'], ['2', 'Freezes a month'], ['0', 'Minutes of screen time counted']]} />

      {/* The five ranks, each tile haloed so the row reads as lit rather than printed. */}
      <section className="mk-cont mk-cream" style={{ background: 'var(--color-marketing-canvas)' }}>
        <div style={{ maxWidth: 'var(--width-wide)', margin: '0 auto' }}>
          <div className="lift-2" style={{ background: 'var(--color-surface)', borderRadius: 'var(--radius-2xl)', border: '1px solid var(--color-border)', padding: '1.9rem 1.6rem' }}>
            <p className="eyebrow" style={{ margin: '0 0 1.3rem', color: 'var(--color-text-muted)', textAlign: 'center' }}>Five ranks a season, and the season resets</p>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 18 }}>
              {RANKS.map(([t, r, d]) => (
                <div key={t} style={{ textAlign: 'center' }}>
                  <span className="halo" style={{ position: 'relative', display: 'inline-grid', placeItems: 'center' }}>
                    <span style={{ position: 'relative', zIndex: 1 }}><RankBadge rank={r} size="lg" /></span>
                  </span>
                  <div style={{ marginTop: 12, fontSize: '1rem', fontWeight: 700, letterSpacing: 'var(--tracking-tight)' }}>{t}</div>
                  <div style={{ fontSize: 'var(--text-meta)', color: 'var(--color-text-muted)', marginTop: 2 }}>{d}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* What earns. Ordered by how hard it is to fake — a check-in at a door beats
          anything you can do from a sofa, and the numbers say so out loud. */}
      <section className="dot-grid mk-cont mk-cream" style={{ position: 'relative', background: 'var(--color-marketing-canvas)' }}>
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 'var(--width-wide)', margin: '0 auto' }}>
          <window.MkEdHead eyebrow="What earns" title="Sparks come from doors" script="not from scrolling" blurb="Ordered by how hard it is to fake. A verified check-in at a real door is worth more than everything you can do from a sofa put together." />
          <div className="qs-4up stagger" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14, marginTop: 'var(--space-10)' }}>
            {[['door-open', '+25', 'Check in at an event', 'Scanned at the door. The single biggest payout in the game.'],
              ['users', '+12', 'Show up to your Circle', 'Weekly, verified by the host counting heads.'],
              ['user-plus', '+10', 'Bring somebody new', 'They turn up, you both earn. Invites alone are worth nothing.'],
              ['sparkles', '+4', 'Log a practice', 'Breath, movement, a walk. Small, daily, and capped.']].map(([i, v, t, d]) => (
              <article key={t} className="reveal lift-2" style={{ background: 'var(--color-surface)', borderRadius: 'var(--radius-2xl)', padding: '1.4rem 1.3rem', border: '1px solid var(--color-border)' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                  <span style={{ width: 34, height: 34, display: 'grid', placeItems: 'center', borderRadius: 'var(--radius-control)', background: 'var(--color-primary-bg)', color: 'var(--color-primary-strong)' }}><IcNSQ n={i} s={17} /></span>
                  <span style={{ fontFamily: 'var(--font-mono)', fontVariantNumeric: 'tabular-nums', fontSize: '1.3rem', color: 'var(--color-primary-strong)' }}>{v}</span>
                </div>
                <h3 style={{ margin: '0.85rem 0 0', fontSize: '1rem', letterSpacing: 'var(--tracking-tight)' }}>{t}</h3>
                <p style={{ margin: '0.35rem 0 0', fontSize: '0.92rem', lineHeight: 1.6, color: 'var(--color-text-muted)' }}>{d}</p>
              </article>
            ))}
          </div>
          <p style={{ margin: '1.4rem auto 0', maxWidth: 'var(--width-read)', textAlign: 'center', fontSize: '0.95rem', lineHeight: 1.65, color: 'var(--color-text-muted)' }}>
            Sparks cannot be bought with money at any price. They buy a streak freeze and a season cosmetic — never standing, and never a place above somebody else.
          </p>
        </div>
      </section>

      <div className="light-strip" />
      <section className="bg-slat scanlines mk-band mk-ink" style={{ position: 'relative' }}>
        <div className="amber-glow" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }} />
        <div style={{ position: 'relative', zIndex: 3, maxWidth: 'var(--width-read)', margin: '0 auto', textAlign: 'center' }}>
          <h2 className="font-display" style={{ margin: 0, fontSize: 'var(--text-display-h2)', color: 'var(--color-on-ink)' }}>
            Streaks that <span style={{ color: 'var(--color-primary)' }}>never punish you</span>
          </h2>
          <p style={{ margin: '1.1rem auto 0', maxWidth: '32rem', fontSize: '1.15rem', lineHeight: 1.7, color: 'var(--color-on-ink-muted)' }}>
            The dot for a day you missed is hollow, not red. Nothing here is engineered to make you feel bad about a Tuesday.
          </p>
        </div>
      </section>
      <div className="light-strip" />

      <section className="grain mk-beat mk-cream" style={{ position: 'relative', background: 'var(--color-marketing-canvas)' }}>
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 'var(--width-wide)', margin: '0 auto' }}>
          <div style={{ textAlign: 'center', maxWidth: '36rem', margin: '0 auto' }}>
            <p className="eyebrow" style={{ margin: 0, color: 'var(--color-primary-strong)' }}>Three laws</p>
            <h2 className="font-display" style={{ margin: '0.7rem 0 0', fontSize: 'var(--text-display-h2)' }}>How the game behaves</h2>
          </div>
          <div className="mk-3up" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 18, marginTop: 'var(--space-10)' }}>
            {LAWS.map(([t, ic, d]) => (
              <div key={t} className="lift-2 edge-light" style={{ background: 'var(--color-surface)', borderRadius: 'var(--radius-2xl)', border: '1px solid var(--color-border)', padding: '1.6rem 1.5rem' }}>
                <span style={{ width: 42, height: 42, borderRadius: 'var(--radius-xl)', display: 'grid', placeItems: 'center',
                  background: 'var(--color-primary-bg)', color: 'var(--color-primary-strong)' }}>
                  <IcNSQ n={ic} s={20} />
                </span>
                <h3 className="font-display" style={{ margin: '1.1rem 0 0', fontSize: '1.4rem' }}>{t}</h3>
                <p style={{ margin: '0.55rem 0 0', fontSize: '0.98rem', lineHeight: 1.65, color: 'var(--color-text-muted)' }}>{d}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* A season, in photographs. The game is abstract until you see the rooms it
          points at. */}
      <section className="mk-beat mk-cream" style={{ background: 'var(--color-surface)' }}>
        <div style={{ maxWidth: 'var(--width-wide)', margin: '0 auto' }}>
          <window.MkEdHead eyebrow="Where the season goes" title="What the rewards" script="are actually pointing at" />
          <window.PhotoTrio items={[
            ['../../assets/images/circle-morning-card.jpg', 'The 6:30am', 'A practice you would never do alone, made trivial by six people expecting you.'],
            ['../../assets/images/parachute-card.jpg', 'The ridiculous one', 'A parachute on a lawn. Worth exactly as many sparks as anything more dignified.'],
            ['../../assets/images/beach-dance-card.jpg', 'The last night', 'A season closes on a room, not a leaderboard. Ranks expire so nobody is permanently above anybody.'],
          ]} />
        </div>
      </section>

      <window.FaqList items={[
        { q: 'Can I buy sparks?', a: 'No, at any price. They come from turning up, and the only things they buy are a streak freeze and a season cosmetic — never standing.' },
        { q: 'What happens when a season ends?', a: 'Ranks expire and everybody starts the next one level. Nobody is permanently above anybody, which is the point of a season rather than a ladder.' },
        { q: 'Does screen time earn anything?', a: 'Almost nothing, deliberately. A logged practice is four sparks; a verified check-in at a door is twenty-five. The gap is the whole design.' },
        { q: 'What if I miss a day?', a: 'The dot goes hollow, not red. You get two freezes a month, and missing twice is the only thing worth noticing — between you and your own page.' },
      ]} />
      <window.BetaCTA />
    </>
  );
}

function Mount() {
  return (<><window.MarketingHeader onNav={() => {}} /><Page /><window.MarketingFooter onNav={() => {}} /></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Mount />);
</script>
</body>
