<script type="text/babel" data-presets="react">
const NSL = window.DAWNFrequencyDesignSystem_c868e3;
const IcL = ({ n, s = 20 }) => <window.MkIco n={n} style={{ width: s, height: s }} />;

const ROOMS = [
  { n: '01', t: 'Sauna', d: 'Cedar, around 190 degrees, seating fourteen. Rounds on the hour, so nobody arrives at a closed door.', img: '../../assets/images/lab-thermal.jpg' },
  { n: '02', t: 'Cold plunge', d: 'Two tubs near 48 degrees. Somebody counting you down, which is the only reason anyone stays in.', img: '../../assets/images/lab-pool.jpg' },
  { n: '03', t: 'The floor', d: 'Movement, breathwork, sound baths. Bolsters in the cupboard and nothing bolted down.', img: '../../assets/images/lab-lounge.jpg' },
];

// The build, said plainly. A vision page that will not say where it actually is
// reads as a sales pitch; this one is dated and specific about what does not exist.
const BUILD = [
  ['Now', 'Circles, in borrowed rooms', 'Twenty-odd groups meeting weekly in parks, kitchens and rented studios. The community is real; the building is not.'],
  ['2027', 'Site and permits', 'A shortlist in North County, then the long unglamorous part: zoning, plumbing for two tubs, and a landlord who understands what we are doing.'],
  ['2028', 'The first Lab opens', 'One building in Vista. If it works, the second one is a template rather than an experiment.'],
];

function Page() {
  const { Button, Stat } = NSL;
  return (
    <>
      {/* Hero: photography, vignette pulling the corners, scanlines over the top,
          and the seam at the bottom edge. Three layers, one purpose. */}
      <section className="bg-slat vignette scanlines mk-ink" style={{ position: 'relative', minHeight: '78vh', display: 'grid', placeItems: 'center', overflow: 'hidden', padding: '5rem 1.5rem' }}>
        <img src="../../assets/images/lab-thermal.jpg" alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', opacity: 0.42 }} />
        <div className="amber-glow" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }} />
        <div style={{ position: 'relative', zIndex: 3, textAlign: 'center', maxWidth: 860 }}>
          <p className="eyebrow" style={{ display: 'inline-flex', alignItems: 'center', gap: 8, margin: 0,
            padding: '0.3rem 0.85rem 0.3rem 0.6rem', borderRadius: 'var(--radius-pill)', color: 'var(--color-primary)',
            background: 'color-mix(in srgb, var(--color-ink) 52%, transparent)',
            border: '1px solid color-mix(in srgb, var(--color-primary) 32%, transparent)' }}>
            <span className="halo" style={{ position: 'relative', width: 7, height: 7, borderRadius: '50%', background: 'var(--color-primary)' }} />

          </p>
          <h1 className="font-display" style={{ margin: '1rem 0 0', fontSize: 'clamp(3rem, 7vw, 5.4rem)', lineHeight: 0.94, color: 'var(--color-on-ink)' }}>Heat then cold</h1>
          <p style={{ margin: '0.2rem 0 0', fontFamily: 'var(--font-editorial)', fontStyle: 'italic', fontSize: 'clamp(1.7rem, 3.4vw, 2.8rem)', lineHeight: 1.1, color: 'var(--color-primary)' }}>
            with other people
          </p>
          <p style={{ margin: '1.4rem auto 0', maxWidth: '34rem', fontSize: '1.15rem', lineHeight: 1.65, color: 'var(--color-on-ink-muted)' }}>
            A settled nervous system is not something you can download. The body of the community is a room with a sauna, a plunge, and somebody counting you down — and we have not built it yet.
          </p>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginTop: '2rem', flexWrap: 'wrap' }}>
            <Button size="lg" iconRight={<IcL n="arrow-right" s={18} />}>Follow the build</Button>
            <Button size="lg" variant="secondary" tone="ink">Find a Circle now</Button>
          </div>
          <p style={{ margin: '1.5rem auto 0', maxWidth: '32rem', fontSize: '0.9rem', lineHeight: 1.6, color: 'var(--color-on-ink-subtle)' }}>
            Nothing here is bookable. The Lab is scheduled to open in 2028 — until then the community meets in rooms we borrow, and this page is the plan rather than the place.
          </p>
        </div>
        <div className="light-strip" style={{ position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 4 }} />
      </section>

      {/* The rooms: raised dark panels, each with the edge-light rim and a haloed
          numeral. The texture stays on ink; the page has not gone cream yet. */}

            <p style={{ margin: '1.1rem auto 0', maxWidth: 'var(--width-read)', fontSize: '1.05rem', lineHeight: 1.7, color: 'var(--color-on-ink-muted)' }}>

            </p>
          </div>
          <div className="mk-3up" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20, marginTop: 'var(--space-10)' }}>

                    display: 'grid', placeItems: 'center', background: 'var(--color-primary)', color: 'var(--color-text-on-primary)',

                    <span style={{ position: 'relative', zIndex: 1 }}>{r.n}</span>
                  </span>
                </div>
                <div style={{ padding: '1.9rem 1.4rem 1.5rem' }}>
                  <span className="eyebrow" style={{ fontSize: 'var(--text-3xs)', color: 'var(--color-on-ink-subtle)' }}>Reference, not our room</span>
                  <h3 className="font-display" style={{ margin: '0.4rem 0 0', fontSize: '1.55rem', color: 'var(--color-on-ink)' }}>{r.t}</h3>
                  <p style={{ margin: '0.55rem 0 0', fontSize: '0.98rem', lineHeight: 1.65, color: 'var(--color-on-ink-muted)' }}>{r.d}</p>
                </div>
              </article>
            ))}
          </div>
        </div>
      </section>

      {/* The slat fades into cream rather than stopping at a hard seam: the one place
          a seam would read as a wall. */}
      <div className="bg-slat slat-fade" style={{ height: 90, position: 'relative' }} />

      <section className="grain mk-cream" style={{ position: 'relative', padding: 'var(--space-section) 1.5rem', background: 'var(--color-marketing-canvas)' }}>
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 'var(--width-wide)', margin: '0 auto' }}>
          <div style={{ maxWidth: 'var(--width-read)', margin: '0 auto', textAlign: 'center' }}>
            <p className="eyebrow" style={{ margin: 0, color: 'var(--color-primary-strong)' }}>Where this actually is</p>
            <h2 className="font-display" style={{ margin: '0.7rem 0 1.2rem', fontSize: 'var(--text-display-h2)' }}>

            <p style={{ margin: 0, fontSize: '1.15rem', lineHeight: 1.7, color: 'var(--color-text-muted)' }}>

          <div className="mk-3up" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginTop: '2.4rem' }}>

                border: '1px solid ' + (i === 2 ? 'color-mix(in srgb, var(--color-primary) 38%, transparent)' : 'var(--color-border)') }}>
                <div className="font-display" style={{ fontSize: '2.1rem', lineHeight: 1, color: i === 2 ? 'var(--color-primary-strong)' : 'var(--color-text)' }}>{when}</div>
                <h3 style={{ margin: '0.6rem 0 0', fontSize: '1.05rem', letterSpacing: 'var(--tracking-tight)' }}>{t}</h3>

          </p>
        </div>
      </section>

      {/* Meanwhile, the thing that already exists. A vision page that sends you away
          empty-handed wastes the visit. */}
      <section className="mk-beat mk-cream" style={{ background: 'var(--color-surface)' }}>
        <div style={{ maxWidth: 'var(--width-wide)', margin: '0 auto' }}>
          <window.MkEdHead eyebrow="In the meantime" title="The community is here" script="the building is the sequel" blurb="Everything the Lab is meant to hold is already happening in borrowed rooms. You do not have to wait until 2028 to be part of it." />
          <window.PhotoTrio items={[
            ['../../assets/images/circle-morning-card.jpg', 'Circles, weekly', 'Small standing groups meeting on a fixed day, mostly outdoors, mostly free.'],
            ['../../assets/images/lawn-practice-card.jpg', 'Practice, anywhere', 'The breathwork and movement the floor is being built for, on a public lawn at sunrise.'],
            ['../../assets/images/parachute-card.jpg', 'The ridiculous parts', 'A parachute on the grass. No facility required, which is rather the point.'],
          ]} />
        </div>
      </section>

      <window.BetaCTA />
    </>
  );
}

function Mount() {
  return (<><window.MarketingHeader onNav={() => {}} /><Page /><window.MarketingFooter onNav={() => {}} /></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Mount />);
</script>
