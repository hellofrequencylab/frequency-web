        { q: 'What happens on September 1, 2026?', a: 'The free allowances start counting. Nothing is removed before then, and nothing about your rate changes on that date — it is when the meters begin, not when the price does.' },
      ]} />
      <window.BetaCTA />
    </>
  );
}

function Mount() { return (<><window.MarketingHeader onNav={() => {}} /><Page /><window.MarketingFooter onNav={() => {}} /></>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Mount />);
</script>
