<!-- @dsCard group="Foundations · Type" viewport="1180x253" name="Mono · Geist Mono" subtitle="Code, tokens, and tabular UI — counts, currencies, timestamps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-subtle); margin-bottom: 12px; }
  .code { font-family: var(--font-mono); font-size: 14px; line-height: 1.7; color: var(--color-text-muted); }
  .code .k { color: var(--color-primary-strong); }
  .code .v { color: var(--color-signal-strong); }
  .nums { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--color-text); margin-top: 10px; letter-spacing: 0.02em; }
</style>
<style>html{background:var(--color-surface);min-height:100vh}body{background:var(--color-surface);min-height:100vh;box-sizing:border-box}</style>
</head>
<body>
  <div class="meta">Geist Mono · 400 / 500 / 600</div>
  <div class="code"><span class="k">--color-primary</span>: <span class="v">#E2912F</span>;<br><span class="k">--radius-2xl</span>: <span class="v">24px</span>;</div>
  <div class="nums">⚡ 1,240 zaps&nbsp;&nbsp;·&nbsp;&nbsp;💎 86 gems&nbsp;&nbsp;·&nbsp;&nbsp;14:08</div>
</body>
</html>
