<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="App shell" description="The signed-in Frequency shell: top bar, left area rail with the account dock, a centre column, the status rail, and the Vault dock." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-canvas); }
  body { font-family: var(--font-sans); color: var(--color-text); overflow: hidden; }
  a { color: var(--color-primary-strong); }
  a:hover { color: var(--color-primary); }
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 99px; border: 3px solid var(--color-canvas); }
  /* Both rails are tracks of ONE grid, so folding a rail moves only its own edge and
     hands the space to the canvas. A folded rail is a visible strip, never a gap. */
  .app-grid { display: grid; grid-template-columns: 12rem minmax(0, 1fr) 19rem; column-gap: var(--space-10); align-items: start; }
  .app-nav, .app-rail { min-width: 0; }
  .app-nav > *, .app-rail > * { width: 100%; }
  .app-col { width: 100%; max-width: 720px; margin: 0 auto; min-width: 0; display: flex; flex-direction: column; }
  /* The shed order: the rail folds to a strip first, then the nav goes to icons. */
  @media (max-width: 1400px) { .app-grid { grid-template-columns: 12rem minmax(0, 1fr) 2.375rem; column-gap: var(--space-7); } }
  @media (max-width: 1180px) { .app-grid { grid-template-columns: 3.25rem minmax(0, 1fr) 2.375rem; column-gap: var(--space-6); } }
  @media (max-width: 1320px) { .app-topbar { gap: 12px !important; } .tb-kbd { display: none !important; } }
  @media (max-width: 1180px) { .tb-nav { display: none !important; } }
  @media (max-width: 1080px) { .tb-mindless-label { display: none !important; } }
  @media (max-width: 820px) { .tb-search { display: none !important; } }
</style>
</helmet>
<div class="shell">
  <x-import component-from-global-scope="TopBar" from="./chrome.jsx" hint-size="100%,62px"></x-import>
  <main class="scroll" style="flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 1.5rem">
    <div class="app-grid">
      <x-import component-from-global-scope="NavRail" from="./chrome.jsx" active="feed" hint-size="100%,520px"></x-import>

      <!-- The centre column. Everything here is ordinary markup: edit it, replace it,
           delete it. The chrome around it is the part you want to keep. -->
      <div class="app-col">
        <div style="display:flex;align-items:center;gap:14px;margin:1.25rem 0 0;padding:0.85rem 1rem;background:var(--color-primary-bg);border:1px solid color-mix(in srgb, var(--color-primary) 30%, transparent);border-radius:var(--radius-card)">
          <x-import component-from-global-scope="Ico" from="./chrome.jsx" n="calendar-clock" hint-size="20px,20px" style="width:20px;height:20px;flex-shrink:0;color:var(--color-primary-strong)"></x-import>
          <p style="margin:0;flex:1;font-size:0.95rem;line-height:1.5;color:var(--color-text)"><b>Summer of Frequency</b> runs through September 1. Free the whole way, your opening beta price stays locked.</p>
          <span style="flex-shrink:0;padding:0.3rem 0.7rem;border-radius:var(--radius-pill);background:var(--color-surface);font-size:var(--text-meta);font-weight:700;color:var(--color-primary-strong)">29 days left</span>
        </div>

        <div style="display:flex;align-items:flex-start;gap:16px;margin-top:26px">
          <div style="flex:1">
            <p class="eyebrow" style="margin:0;color:var(--color-primary-strong)">Monday, August 3</p>
            <h1 style="margin:0.4rem 0 0;font-size:1.9rem">Good morning, Daniel</h1>
            <p style="margin:0.25rem 0 0;font-size:0.95rem;color:var(--color-text-muted)">What your people are up to today.</p>
          </div>
          <x-import component-from-global-scope="DAWNFrequencyDesignSystem_c868e3.Button" icon="plus" hint-size="112px,40px">Create</x-import>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;padding-bottom:3rem;margin-top:14px">
          <x-import component-from-global-scope="DAWNFrequencyDesignSystem_c868e3.StreakMeter" days="{{ streakDays }}" freezes="2" hint="Never miss twice" week="{{ week }}" hint-size="100%,64px"></x-import>
          <x-import component-from-global-scope="FeedComposer" from="./chrome.jsx" hint-size="100%,96px"></x-import>
          <x-import component-from-global-scope="FeedPostCard" from="./chrome.jsx" post="{{ pinned }}" hint-size="100%,200px"></x-import>
          <x-import component-from-global-scope="FeedPostCard" from="./chrome.jsx" post="{{ second }}" hint-size="100%,320px"></x-import>
        </div>
      </div>

      <div class="app-rail">
        <sc-if value="{{ railOpen }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="RightRail" from="./chrome.jsx" hint-size="100%,640px"></x-import>
        </sc-if>
        <sc-if value="{{ railFolded }}">
          <x-import component-from-global-scope="RailStrip" from="./chrome.jsx" hint-size="100%,208px"></x-import>
        </sc-if>
      </div>
    </div>
  </main>
  <x-import component-from-global-scope="VaultDock" from="./chrome.jsx" hint-size="0,0"></x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;rail&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;folded&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;'open' | 'folded'&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;streakDays&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:50,&quot;min&quot;:0,&quot;max&quot;:365,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  // The seed content the shell opens with. Swap it for your own data source; the
  // markup in the template is what you edit, this is only what fills it.
  renderVals() {
    const rail = this.props.rail ?? 'open';
    return {
      railOpen: rail === 'open',
      railFolded: rail === 'folded',
      streakDays: this.props.streakDays ?? 50,
      week: ['logged', 'logged', 'frozen', 'logged', 'logged', 'logged', 'today'],
      pinned: {
        id: 1, author: 'Daniel Tyack', handle: 'danieltyack', role: 'janitor', announcement: true, pinned: true, time: 'Jul 15',
        body: 'Welcome to the beta. It is a beta, so you will find things that are not working, and that is the point. When something breaks, hit Report a bug and send me a message.',
        hearts: 1, plus: 1, replies: 0, myHeart: false, myPlus: false,
      },
      second: {
        id: 2, author: 'Aiden Tyack', handle: 'aiden', role: 'host', time: 'Jun 27', online: true,
        body: 'First cold plunge at the Lab this morning. Three minutes felt impossible and then it did not. Walked out lighter than I have felt in months.',
        image: '../../assets/images/lab-pool.jpg', hearts: 24, plus: 8, replies: 6, myHeart: true, myPlus: false,
      },
    };
  }
}

</script>
</body>
</html>
