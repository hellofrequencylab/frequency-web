<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 26px; background: var(--color-surface); font-family: var(--font-sans); color: var(--color-text); }
  .block { margin-bottom: 30px; }
  .glab { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-subtle); margin-bottom: 12px; }

<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs } = window.DAWNFrequencyDesignSystem_c868e3;
function Demo() {
  const [tab, setTab] = React.useState('feed');
  const [t2, setT2] = React.useState('mind');
  return (
    <div>
      <div className="block">
        <div className="glab">Tabs — entity detail</div>
        <Tabs value={tab} onChange={setTab} tabs={[
          { value: 'feed', label: 'Feed', count: 24 },
          { value: 'events', label: 'Events', count: 3 },
          { value: 'members', label: 'Members', count: 18 },
          { value: 'about', label: 'About' },
        ]} />
      </div>
      <div className="block" style={{ marginBottom: 0 }}>
        <div className="glab">Tabs — channel filter</div>
        <Tabs value={t2} onChange={setT2} tabs={['Mind', 'Body', 'Spirit', 'Expression'].map(l => ({ value: l.toLowerCase(), label: l }))} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
