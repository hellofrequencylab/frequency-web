<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page editor · Frequency Admin</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="editor/editor.css"></head>
<body data-theme="commons" data-energy="flow" data-screen-label="Admin Page editor">
<div class="pe" data-lf="0" data-rf="0" data-preview="0">
<header class="top">
<a class="ib" href="Overview.html" title="Back to Overview" aria-label="Back to Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div class="brand"><span class="av"></span><span><b>Royal Temple</b><small>frequency.city/royal-temple</small></span></div>
<div class="pick" id="pick"><button type="button" aria-haspopup="true"><span id="pname">Home</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"></path></svg></button>
<div class="menu" id="pmenu"><button data-p="Home">Home<span class="sp"></span><span class="dot" style="background:#2F7F5A"></span></button><button data-p="Schedule">Schedule</button><button data-p="Hosts">Hosts</button><button data-p="Memberships">Memberships<span class="sp"></span><span class="dot" style="background:#A86A00"></span></button><button data-p="Visit">Visit</button><div class="sep"></div><button data-p="New page">+ New page</button></div></div>
<span class="save" id="save"><i></i><span>Draft saved · 2 min ago</span></span>
<span class="sp"></span>
<button class="ib" id="lfold" title="Fold left rail" aria-label="Fold left rail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9 4.5v15"></path></svg></button>
<div class="seg dev" role="group" aria-label="Device"><button class="on" data-d="desktop" title="Desktop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2.5"></rect><path d="M9 20h6M12 16.5V20"></path></svg></button><button data-d="tablet" title="Tablet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M11 18h2"></path></svg></button><button data-d="phone" title="Phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2.8"></rect><path d="M11 18h2"></path></svg></button></div>
<button class="ib" id="rfold" title="Fold inspector" aria-label="Fold inspector"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M15 4.5v15"></path></svg></button>
<button class="ib" id="undo" title="Undo ⌘Z" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-2"></path></svg></button>
<button class="ib" id="redo" title="Redo ⇧⌘Z" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h2"></path></svg></button>
<button class="ib" id="preview" title="Preview ⌘P" aria-label="Preview" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button>
<span class="faces" title="Audrey and Marcus are here"><span style="background-image:url('../../assets/photos/gathering-03.jpg')"></span><span style="background-image:url('../../assets/photos/gathering-05.jpg')"></span></span>
<button class="btn sm" id="share">Share</button>
<button class="btn pa" id="publish">Publish <span id="pubn" style="min-width:0;font:600 12px/1 var(--font-sans);opacity:.75"></span></button>
</header>
<aside class="rail">
<div class="tabs" role="tablist"><button data-t="pages"><svg class="fq-icon"><use href="#page"></use></svg><span>Pages</span></button><button data-t="layers" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"></path><path d="m3.5 12 8.5 4.5 8.5-4.5M3.5 16l8.5 4.5 8.5-4.5"></path></svg><span>Layers</span></button><button data-t="add"><svg class="fq-icon"><use href="#plus"></use></svg><span>Add</span></button><button data-t="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-1 1.6-2.2-.5-1.4.3-2.8 1.8-2.8h1.6a3.5 3.5 0 0 0 3.5-3.5c0-4.7-3.8-8.5-8.5-8.5z"></path></svg><span>Theme</span></button><button data-t="site"><svg class="fq-icon"><use href="#settings"></use></svg><span>Site</span></button></div>
<div class="body" id="lbody"></div>
<div class="foot"><span class="lbl">Changes save as a draft</span><a class="btn sm txt" href="../website/Spaces.html">Live site</a></div>
</aside>
<main class="stage" id="stage" data-device="desktop">
<div class="scroller" id="scroller"><div class="frame" id="frame"></div></div>
<div class="zoom"><button class="ib" id="zm" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 12h12"></path></svg></button><span id="zv">100%</span><button class="ib" id="zp" aria-label="Zoom in"><svg class="fq-icon"><use href="#plus"></use></svg></button></div>
<div class="vera"><div class="reply" id="vreply"></div><form class="bar" id="vform"><span class="orb"></span><input id="vin" placeholder="Ask Vera to change this page…" aria-label="Ask Vera"><span class="ctx" id="vctx">Hero</span><button class="btn sm ink" type="submit">Ask</button></form><div class="chips" id="vchips"></div></div>
</main>
<aside class="insp" id="insp"></aside>
</div>
<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pt"><button class="ib x" data-close aria-label="Close"><svg class="fq-icon"><use href="#close"></use></svg></button>
<span style="font:500 10.5px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)">Royal Temple · Home</span><h2 id="pt" style="margin-top:12px">Ready to publish?</h2>
<div class="chg" id="chg"></div>
<div class="chk"><i>✓</i>Every image has alt text</div><div class="chk"><i>✓</i>Page title and description set</div><div class="chk"><i class="w">!</i>Memberships page has unpublished changes</div>
<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px"><div class="seg" id="when"><button class="on" data-v="now" style="flex:1">Publish now</button><button data-v="later" style="flex:1">Schedule</button></div><div id="schedf" style="display:none;gap:8px"><input class="in" value="Thu, Oct 15"><input class="in" value="9:00am"></div>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" data-close>Keep editing</button><button class="btn pa" id="go">Publish now</button></div></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="../../assets/icons/icons.js"></script><script src="editor/editor.js"></script></body></html>
