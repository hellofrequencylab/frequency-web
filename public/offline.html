<!doctype html>
<!--
  The page public/sw.js serves when a page load finds no network (LIVE-702, ADR-1638).
  Precached at worker install, so it must stand alone: no app CSS, no fonts, no scripts
  from the build. The colours are the DAWN light and dark values from app/globals.css
  (canvas, surface, border, text, text-muted, primary-strong / primary, ink), copied as
  values because a cached static file cannot read the app's custom properties.
  Changing this file? Bump OFFLINE_VERSION in public/sw.js so installed phones fetch it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17120B" media="(prefers-color-scheme: dark)">
<title>You're offline · Frequency</title>
<style>
  :root {
    color-scheme: light dark;
    --canvas: #FAF8F4;
    --surface: #FFFFFF;
    --border: #EAE6DE;
    --text: #3D352A;
    --muted: #6B6253;
    --action: #965C12;
    --on-action: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #17120B;
      --surface: #211A10;
      --border: #3C3220;
      --text: #EFE8DB;
      --muted: #A99C88;
      --action: #F2B14E;
      --on-action: #141210;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--canvas);
    color: var(--text);
    font-family: ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  main {
    width: 100%;
    max-width: 26rem;
    padding: 32px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    text-align: center;
  }
  img { display: block; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; font-weight: 800; }
  p { margin: 0 0 12px; font-size: 1rem; }
  .aside { color: var(--muted); font-size: 0.9375rem; margin-bottom: 24px; }
  button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    min-height: 44px;
    padding: 10px 24px;
    background: var(--action);
    color: var(--on-action);
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="64" height="64">
  <h1>You're offline</h1>
  <p>This page needs a connection, and your phone doesn't have one right now. We'll load it the moment you're back.</p>
  <p class="aside">While you wait, try three slow breaths. Nobody's counting.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload() })
  window.addEventListener('online', function () { location.reload() })
</script>
</body>
</html>
